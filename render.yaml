# Render 배포 설정
# 이 폴더(shared-paint)를 GitHub 저장소의 루트로 올린 뒤,
# Render에서 Blueprint(또는 New Web Service)로 연결하면 이 파일이 자동으로 읽힙니다.

services:
  - type: web
    name: shared-paint
    runtime: node
    plan: free
    buildCommand: echo "설치할 의존성 없음"
    startCommand: node server.js
    envVars:
      # 접속 암호 — Render 대시보드에서 직접 값을 입력합니다(코드에 남기지 않음).
      - key: ROOM_PASSWORD
        sync: false

  # 영단어장 — site/ 폴더만 올리는 별도의 정적 사이트.
  # 위 그림판 서비스와 완전히 분리되어 있어 암호 체계에는 영향을 주지 않는다.
  # 무료 플랜이지만 정적 사이트는 잠들지 않아 휴대폰에서 바로 열린다.
  - type: web
    name: youb-wordbook
    runtime: static
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      # 검색엔진 수집 차단 (robots.txt와 이중으로)
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
