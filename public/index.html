<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>공유 그림판</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #21252e;
    --line: #2e3440;
    --text: #e7eaf0;
    --muted: #949cad;
    --accent: #4f8cff;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ── 상단 바 ───────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .dot.on { background: #22c55e; }
  .dot.off { background: #ef4444; }

  #nameInput {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 10px; font-size: 13px; width: 130px;
    font-family: inherit;
  }
  #nameInput:focus { outline: none; border-color: var(--accent); }

  .peers { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .peer {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12px;
  }
  .peer i { width: 9px; height: 9px; border-radius: 50%; display: block; }

  /* ── 도구 바 ───────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tool {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .tool:hover { border-color: #48505f; }
  .tool.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tool.danger:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

  #shapeTool {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  #shapeTool:focus { outline: none; border-color: var(--accent); }
  #shapeTool.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .swatches { display: flex; gap: 5px; }
  .sw {
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .sw.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  #customColor {
    width: 30px; height: 24px; padding: 0; border: 1px solid var(--line);
    border-radius: 6px; background: none; cursor: pointer;
  }

  .sizer { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #width { width: 110px; accent-color: var(--accent); }
  #widthVal {
    width: 46px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 2px; font-size: 12px; font-family: inherit;
  }
  #widthVal:focus { outline: none; border-color: var(--accent); }

  .sep { width: 1px; height: 22px; background: var(--line); }

  /* ── 본문 ─────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  .stage {
    flex: 1; min-width: 0; display: flex;
    align-items: center; justify-content: center;
    padding: 14px; background: #0b0d11;
  }

  /* ── 빙고 ─────────────────────────────── */
  .bingo { display: none; flex-direction: column; align-items: center; gap: 14px;
           width: 100%; height: 100%; overflow-y: auto; padding: 4px; }
  .bingo.on { display: flex; }

  .bingo-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .bingo-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #bingoStatus { font-size: 15px; font-weight: 700; text-align: center; min-height: 22px; }
  #bingoStatus .hl { color: var(--accent); }
  #bingoStatus .win { color: #fbbf24; }

  .board { display: grid; gap: 6px; }
  .board .num {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; font-size: 20px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1; cursor: default; transition: transform .08s;
  }
  .board .num.hit { background: var(--accent); border-color: var(--accent); color: #fff; }
  .board.myturn .num:not(.hit) { cursor: pointer; }
  .board.myturn .num:not(.hit):hover { border-color: var(--accent); transform: scale(1.05); }

  .scores { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .scores .s {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px 5px 9px;
  }
  .scores .s.turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .scores .s i { width: 9px; height: 9px; border-radius: 50%; }
  .scores .s em { font-style: normal; font-weight: 700; color: var(--accent); }

  .calledList { font-size: 12px; color: var(--muted); text-align: center; max-width: 460px; line-height: 1.7; }

  /* ── 라이어 게임 ──────────────────────── */
  .liar { display: none; flex-direction: column; align-items: center; gap: 16px;
          width: 100%; height: 100%; overflow-y: auto; padding: 4px; }
  .liar.on { display: flex; }
  .liar-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .liar-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #liarPhase { font-size: 15px; font-weight: 700; text-align: center; }
  #liarPhase .hl { color: var(--accent); }

  /* 역할 카드 */
  .card {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2);
    padding: 22px 34px; text-align: center; min-width: 260px;
  }
  .card .cap { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .word { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .card.isliar { border-color: #b91c1c; background: rgba(185,28,28,.12); }
  .card.isliar .word { color: #f87171; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

  .turns { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.8; max-width: 520px; }
  .turns b { color: var(--text); }

  .voteList { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .voteList button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .voteList button:hover:not(:disabled) { border-color: var(--accent); }
  .voteList button.picked { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .voteList button:disabled { opacity: .5; cursor: default; }
  .voteList button i { width: 9px; height: 9px; border-radius: 50%; }
  .voteList button .done { font-size: 11px; color: #22c55e; }

  .guessBox { display: flex; gap: 8px; }
  .guessBox input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 10px 13px; font-size: 15px; font-family: inherit; width: 220px;
  }
  .guessBox input:focus { outline: none; border-color: var(--accent); }

  .resultBox { text-align: center; }
  .resultBox .big { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .resultBox .big.citizen { color: #4ade80; }
  .resultBox .big.liarwin { color: #f87171; }
  .resultBox .detail { font-size: 13px; color: var(--muted); line-height: 1.9; }
  .resultBox .detail b { color: var(--text); }

  /* ── 레이싱 ───────────────────────────── */
  .race { display: none; flex-direction: column; align-items: center; gap: 10px;
          width: 100%; height: 100%; padding: 2px; }
  .race.on { display: flex; }
  .race-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .race-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  .trackWrap { position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #raceCanvas { display: block; width: 100%; height: 100%; }

  .bigmsg {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
    font-size: 64px; font-weight: 900; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,.8);
  }
  .bigmsg small { font-size: 16px; font-weight: 600; margin-top: 10px; opacity: .9; }

  .standings { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
  .standings .r {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 12px 4px 8px;
  }
  .standings .r.me { border-color: var(--accent); }
  .standings .r.fin { opacity: .6; }
  .standings .r i { width: 9px; height: 9px; border-radius: 50%; }
  .standings .r em { font-style: normal; color: var(--muted); }
  .helpKeys { font-size: 12px; color: var(--muted); text-align: center; }

  /* ── 물풍선 ───────────────────────────── */
  .wb { display: none; flex-direction: column; align-items: center; gap: 8px;
        width: 100%; height: 100%; padding: 2px; }
  .wb.on { display: flex; }
  .wb-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .wb-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #wbStatus { font-size: 14px; font-weight: 700; }
  #wbStatus .hl { color: var(--accent); }
  #wbCanvas { display: block; width: 100%; height: 100%; }

  /* ── 활쏘기 ───────────────────────────── */
  .arch { display: none; flex-direction: column; align-items: center; gap: 10px;
          width: 100%; height: 100%; padding: 2px; }
  .arch.on { display: flex; }
  .arch-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .arch-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #archStatus { font-size: 14px; font-weight: 700; }
  #archStatus .hl { color: var(--accent); }
  #archCanvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .wrap {
    position: relative; background: #fff;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none;
  }
  #board { display: block; width: 100%; height: 100%; cursor: none; }

  /* 내 붓 크기를 보여주는 원 — 캔버스에 그려지는 게 아니라 위에 떠 있는 표시 */
  .brush {
    position: absolute; pointer-events: none; border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(0,0,0,.8);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.85);
    display: none;
  }
  .brush.on { display: block; }
  .brush.erase { border-style: dashed; }
  .brush::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%;
    background: rgba(0,0,0,.75); box-shadow: 0 0 0 1px rgba(255,255,255,.85);
  }

  /* 참여자별 칸 나누기 — 캔버스에 그려지는 게 아니라 위에 덮인 안내선 */
  .grid { position: absolute; inset: 0; pointer-events: none; display: none; }
  .grid.on { display: block; }
  .cell {
    position: absolute; border: 1px dashed rgba(0,0,0,.3);
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  .cell.mine { border: 2px solid; }
  .cell b {
    font-size: 11px; font-weight: 700; color: #fff; margin: 5px;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  .cursor {
    position: absolute; top: 0; left: 0; pointer-events: none;
    transform: translate(-7px, -7px); transition: left .06s linear, top .06s linear;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .cursor b { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .cursor span {
    font-size: 11px; color: #fff; padding: 2px 7px; border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  /* ── 채팅 ─────────────────────────────── */
  .chat {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .chat h2 {
    margin: 0; padding: 12px 14px; font-size: 13px; font-weight: 700;
    border-bottom: 1px solid var(--line); color: var(--muted);
  }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 11px; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #333a46; border-radius: 4px; }
  .line .who { font-size: 11px; font-weight: 700; margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
  .line .who time { color: #6d7686; font-weight: 400; font-size: 10px; }
  .line .body { font-size: 13px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .line.sys { color: var(--muted); font-size: 12px; text-align: center; }

  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); position: relative; }

  /* 채팅 이미지 */
  .chatImg {
    display: block; margin-top: 6px; max-width: 100%; max-height: 150px;
    border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in;
  }
  .chatImg.big { max-height: none; cursor: zoom-out; }
  .imgGone { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* 사진·캡처 버튼 */
  .chatTools { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }
  .chatTool {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 5px 9px; font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .chatTool:hover { border-color: var(--accent); }

  /* @멘션 */
  .mtag {
    background: rgba(79,140,255,.22); color: #9ec1ff; font-weight: 700;
    border-radius: 5px; padding: 0 3px;
  }
  .line.mention { background: rgba(79,140,255,.10); border-left: 3px solid var(--accent);
    margin-left: -14px; padding-left: 11px; border-radius: 0 6px 6px 0; }
  .line.mention .mtag { background: rgba(79,140,255,.35); color: #fff; }

  .mentionBox {
    position: absolute; left: 10px; right: 10px; bottom: 100%; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 9px;
    overflow: hidden; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.45); z-index: 5;
  }
  .mentionBox.on { display: block; }
  .mentionBox button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); padding: 7px 11px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .mentionBox button.sel, .mentionBox button:hover { background: var(--accent); color: #fff; }

  /* 빙고 차례 남은 시간 */
  .turnbar { font-size: 12px; color: var(--muted); min-height: 16px; }
  .turnbar.warn { color: #f87171; font-weight: 700; }

  /* 빙고 순서 */
  .orderBox { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; font-size: 12px; }
  .orderBox .ohead { color: var(--muted); }
  .orow {
    display: flex; align-items: center; gap: 5px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 6px 3px 9px;
  }
  .orow.turn { border-color: var(--accent); }
  .orow i { width: 8px; height: 8px; border-radius: 50%; }
  .orow button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 11px; padding: 0 2px; font-family: inherit;
  }
  .orow button:hover { color: var(--accent); }
  #chatInput {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit; resize: none;
    max-height: 90px; line-height: 1.4;
  }
  #chatInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); border: none; color: #fff; border-radius: 8px;
    padding: 0 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    .chat { width: auto; height: 240px; border-left: none; border-top: 1px solid var(--line); }
    .peers { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">🎨 공유 그림판</div>
  <button class="tool active" id="modePaint">그림판</button>
  <button class="tool" id="modeBingo">🎲 빙고</button>
  <button class="tool" id="modeLiar">🕵 라이어</button>
  <button class="tool" id="modeRace">🏎 레이싱</button>
  <button class="tool" id="modeArch">🏹 활쏘기</button>
  <button class="tool" id="modeWb">💧 물풍선</button>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  <input id="nameInput" maxlength="20" placeholder="내 이름" autocomplete="off">
  <div class="peers" id="peers"></div>
</header>

<div class="toolbar">
  <button class="tool active" id="penBtn">✏️ 펜</button>
  <button class="tool" id="eraserBtn">🧽 지우개</button>
  <select id="shapeTool" title="도형을 고른 뒤 캔버스에서 드래그하세요">
    <option value="">◇ 도형</option>
    <option value="line">╱ 직선</option>
    <option value="rect">□ 네모</option>
    <option value="circle">○ 동그라미</option>
    <option value="triangle">△ 세모</option>
    <option value="arrow">➜ 화살표</option>
    <option value="star">☆ 별</option>
  </select>
  <div class="sep"></div>
  <div class="swatches" id="swatches"></div>
  <input type="color" id="customColor" value="#111111" title="직접 색 고르기">
  <div class="sep"></div>
  <div class="sizer">
    굵기 <input type="range" id="width" min="1" max="60" value="4"><input type="number" id="widthVal" min="1" max="60" value="4" title="숫자를 직접 입력할 수 있습니다">
  </div>
  <div class="sep"></div>
  <button class="tool" id="gridBtn" title="참여자 수에 맞춰 칸을 나누고, 각자 자기 칸에만 그립니다">⊞ 칸 나누기</button>
  <div class="sep"></div>
  <button class="tool" id="undoBtn" title="Ctrl+Z">↶ 실행취소</button>
  <button class="tool danger" id="clearCellBtn" style="display:none">내 칸 지우기</button>
  <button class="tool danger" id="clearBtn">전체 지우기</button>
</div>

<main>
  <div class="stage">
    <div class="wrap" id="wrap">
      <canvas id="board"></canvas>
      <div class="grid" id="grid"></div>
      <div class="brush" id="brush"></div>
    </div>

    <div class="bingo" id="bingo">
      <div id="bingoStatus">빙고가 시작되지 않았습니다</div>
      <div class="bingo-top">
        <select id="bingoSize">
          <option value="4">4 × 4</option>
          <option value="5" selected>5 × 5</option>
        </select>
        <select id="bingoGoal">

<script>
(function () {
  'use strict';

  var CW = 1600, CH = 900;             // 캔버스 논리 크기 (서버와 동일)
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = CW;
  canvas.height = CH;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  var wrap = document.getElementById('wrap');
  var me = { id: null, color: '#111111' };
  var tool = 'pen';
  var color = '#111111';
  var width = 4;
  var ws = null, connected = false;

  // ── 캔버스 크기 맞추기 (비율 유지) ─────────────────
  function fit() {
    var stage = wrap.parentElement;
    var pad = 28;
    var aw = stage.clientWidth - pad;
    var ah = stage.clientHeight - pad;
    if (aw <= 0 || ah <= 0) return;   // 아직 화면에 안 그려진 상태(숨은 탭 등)
    var scale = Math.min(aw / CW, ah / CH);
    wrap.style.width = Math.max(160, Math.floor(CW * scale)) + 'px';
    wrap.style.height = Math.max(90, Math.floor(CH * scale)) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap.parentElement);

  // ── 그리기 ──────────────────────────────────────
  function drawSeg(s) {
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.c;
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(s.x0, s.y0);
    ctx.lineTo(s.x1, s.y1);
    ctx.stroke();
    ctx.restore();
  }

  var SHAPE_TOOLS = { line: true, rect: true, circle: true, triangle: true, arrow: true, star: true };

  function isShapeTool(t) { return !!SHAPE_TOOLS[t]; }

  // 도형도 기존 선분 묶음으로 변환해 동기화와 실행취소 방식을 그대로 사용한다.
  function shapeSegments(kind, a, b) {
    var out = [];
    function add(p, q) { out.push({ x0: p.x, y0: p.y, x1: q.x, y1: q.y }); }

    if (kind === 'line') {
      add(a, b);
    } else if (kind === 'rect') {
      var r1 = { x: b.x, y: a.y }, r2 = { x: a.x, y: b.y };
      add(a, r1); add(r1, b); add(b, r2); add(r2, a);
    } else if (kind === 'circle') {
      var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      var rx = Math.abs(b.x - a.x) / 2, ry = Math.abs(b.y - a.y) / 2;
      var count = 48, prev = { x: cx + rx, y: cy };
      for (var i = 1; i <= count; i++) {
        var ang = i / count * Math.PI * 2;
        var next = { x: cx + Math.cos(ang) * rx, y: cy + Math.sin(ang) * ry };
        add(prev, next); prev = next;
      }
    } else if (kind === 'triangle') {
      var top = { x: (a.x + b.x) / 2, y: a.y };
      var left = { x: a.x, y: b.y }, right = { x: b.x, y: b.y };
      add(top, right); add(right, left); add(left, top);
    } else if (kind === 'arrow') {
      add(a, b);
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.hypot(dx, dy) || 1;
      var head = Math.min(70, Math.max(18, len * 0.28));
      var angle = Math.atan2(dy, dx), spread = Math.PI / 6;
      add(b, { x: b.x - Math.cos(angle - spread) * head, y: b.y - Math.sin(angle - spread) * head });
      add(b, { x: b.x - Math.cos(angle + spread) * head, y: b.y - Math.sin(angle + spread) * head });
    } else if (kind === 'star') {
      var scx = (a.x + b.x) / 2, scy = (a.y + b.y) / 2;
      var srx = Math.abs(b.x - a.x) / 2, sry = Math.abs(b.y - a.y) / 2;
      var points = [];
      for (var j = 0; j < 10; j++) {
        var outer = j % 2 === 0;
        var sa = -Math.PI / 2 + j * Math.PI / 5;
        points.push({
          x: scx + Math.cos(sa) * srx * (outer ? 1 : 0.42),
          y: scy + Math.sin(sa) * sry * (outer ? 1 : 0.42)
        });
      }
      for (var k = 0; k < points.length; k++) add(points[k], points[(k + 1) % points.length]);
    }
    return out;
  }

  function clearCanvas() {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, CW, CH);
    ctx.restore();
  }

  // 지금까지 그려진 획 조각 전부. 실행취소 때 이걸로 다시 그린다.
  var ops = [];
  function redraw() {
    clearCanvas();
    for (var i = 0; i < ops.length; i++) drawSeg(ops[i]);
  }

  function toCanvas(ev) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * CW,
      y: (ev.clientY - r.top) / r.height * CH
    };
  }

  var drawing = false, last = null, shapeStart = null, shapeEnd = null;
  var lastCursorSent = 0, strokeSeq = 0;

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    drawing = true;
    strokeSeq++;                 // 여기서부터 새 획 — 실행취소는 이 단위로 지운다
    last = clampToCell(toCanvas(ev));
    showBrush(ev);
    if (isShapeTool(tool)) {
      shapeStart = last;
      shapeEnd = last;
      return;
    }
    // 점 하나만 찍는 경우도 보이도록 제자리 선을 하나 긋는다
    emitSeg(last, last);
  });

  canvas.addEventListener('pointermove', function (ev) {
    var raw = toCanvas(ev);
    showBrush(ev);

    var now = Date.now();
    if (now - lastCursorSent > 45) {
      lastCursorSent = now;
      send({ t: 'cursor', x: raw.x, y: raw.y });   // 커서는 실제 위치 그대로 알린다
    }

    if (!drawing) return;
    var p = clampToCell(raw);
    if (isShapeTool(tool)) {
      shapeEnd = p;
      redraw();
      ctx.save();
      ctx.globalAlpha = 0.72;
      var preview = shapeSegments(tool, shapeStart, shapeEnd);
      for (var pi = 0; pi < preview.length; pi++) {
        drawSeg({ x0: preview[pi].x0, y0: preview[pi].y0, x1: preview[pi].x1, y1: preview[pi].y1, w: width, c: color, e: false });
      }
      ctx.restore();
      return;
    }
    emitSeg(last, p);
    last = p;
  });

  canvas.addEventListener('pointerleave', function () {
    overCanvas = false;
    brushEl.classList.remove('on');
  });
  canvas.addEventListener('pointerenter', function (ev) {
    overCanvas = true;
    showBrush(ev);
  });

  function stop(ev) {
    if (!drawing) return;
    if (isShapeTool(tool) && shapeStart) {
      if (ev && ev.clientX != null && ev.clientY != null) shapeEnd = clampToCell(toCanvas(ev));
      emitShape(shapeStart, shapeEnd || shapeStart);
    }
    drawing = false;
    last = null;
    shapeStart = null;
    shapeEnd = null;
    try {
      if (ev && ev.pointerId != null && canvas.hasPointerCapture(ev.pointerId)) {
        canvas.releasePointerCapture(ev.pointerId);
      }
    } catch (e) {}
  }
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('pointerleave', stop);

  function emitSeg(a, b) {
    var seg = {
      t: 'seg', sid: strokeSeq,
      x0: Math.round(a.x * 10) / 10, y0: Math.round(a.y * 10) / 10,
      x1: Math.round(b.x * 10) / 10, y1: Math.round(b.y * 10) / 10,
      w: width, c: color, e: tool === 'eraser'
    };
    drawSeg(seg);                                  // 내 화면엔 즉시
    ops.push({ by: me.id, sid: seg.sid, x0: seg.x0, y0: seg.y0, x1: seg.x1, y1: seg.y1, w: seg.w, c: seg.c, e: seg.e });
    send(seg);                                     // 남에게도
  }

  function emitShape(a, b) {
    redraw();                                      // 반투명 미리보기를 지운다
    var pieces = shapeSegments(tool, a, b);
    for (var i = 0; i < pieces.length; i++) {
      var p = pieces[i];
      var seg = {
        t: 'seg', sid: strokeSeq,
        x0: Math.round(p.x0 * 10) / 10, y0: Math.round(p.y0 * 10) / 10,
        x1: Math.round(p.x1 * 10) / 10, y1: Math.round(p.y1 * 10) / 10,
        w: width, c: color, e: false
      };
      drawSeg(seg);
      ops.push({ by: me.id, sid: seg.sid, x0: seg.x0, y0: seg.y0, x1: seg.x1, y1: seg.y1, w: seg.w, c: seg.c, e: false });
      send(seg);
    }
  }

  // ── 붓 크기 원 ──────────────────────────────────
  var brushEl = document.getElementById('brush');
  var lastBrushPos = null, overCanvas = false, brushHideTimer = null;

  function paintBrush() {
    if (!lastBrushPos) return;
    var r = canvas.getBoundingClientRect();
    var scale = r.width / CW;                      // 논리 크기 → 화면 크기 비율
    var d = Math.max(4, width * scale);
    brushEl.style.width = d + 'px';
    brushEl.style.height = d + 'px';
    brushEl.style.left = lastBrushPos.x * scale + 'px';
    brushEl.style.top = lastBrushPos.y * scale + 'px';
    brushEl.classList.toggle('erase', tool === 'eraser');
    brushEl.classList.add('on');
  }

  function showBrush(ev) {
    lastBrushPos = toCanvas(ev);
    paintBrush();
  }

  // ── 도구 UI ─────────────────────────────────────
  var PALETTE = ['#111111', '#e11d48', '#f59e0b', '#16a34a', '#2563eb', '#7c3aed', '#0891b2', '#ffffff'];
  var swatches = document.getElementById('swatches');
  PALETTE.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'sw' + (i === 0 ? ' active' : '');
    b.style.background = c;
    if (c === '#ffffff') b.style.borderColor = '#555';
    b.title = c;
    b.addEventListener('click', function () {
      color = c;
      document.getElementById('customColor').value = c;
      [].forEach.call(swatches.children, function (el) { el.classList.remove('active'); });
      b.classList.add('active');
      if (tool === 'eraser') setTool('pen');
      else paintBrush();
    });
    swatches.appendChild(b);
  });

  document.getElementById('customColor').addEventListener('input', function (e) {
    color = e.target.value;
    [].forEach.call(swatches.children, function (el) { el.classList.remove('active'); });
    if (tool === 'eraser') setTool('pen');
    else paintBrush();
  });

  var penBtn = document.getElementById('penBtn');
  var eraserBtn = document.getElementById('eraserBtn');
  var shapeToolEl = document.getElementById('shapeTool');
  function setTool(t) {
    tool = t;
    penBtn.classList.toggle('active', t === 'pen');
    eraserBtn.classList.toggle('active', t === 'eraser');
    shapeToolEl.classList.toggle('active', isShapeTool(t));
    shapeToolEl.value = isShapeTool(t) ? t : '';
    paintBrush();
  }
  penBtn.addEventListener('click', function () { setTool('pen'); });
  eraserBtn.addEventListener('click', function () { setTool('eraser'); });
  shapeToolEl.addEventListener('change', function () { setTool(shapeToolEl.value || 'pen'); });

  var widthEl = document.getElementById('width');
  var widthVal = document.getElementById('widthVal');
  // 슬라이더와 숫자 입력칸 어느 쪽으로도 굵기를 바꿀 수 있다
  function setWidth(v, fromBox) {
    v = Math.round(Number(v));
    if (!isFinite(v)) return;
    width = Math.min(60, Math.max(1, v));
    widthEl.value = width;
    if (!fromBox) widthVal.value = width;   // 입력 중에는 칸을 건드리지 않는다
    // 마우스를 아직 캔버스에 올리지 않았어도 크기를 볼 수 있게 가운데에 띄워 준다
    if (!lastBrushPos) lastBrushPos = { x: CW / 2, y: CH / 2 };
    paintBrush();
    // 캔버스 밖에서 굵기만 조절한 경우엔 잠깐 보여줬다 감춘다
    clearTimeout(brushHideTimer);
    if (!overCanvas) {
      brushHideTimer = setTimeout(function () { brushEl.classList.remove('on'); }, 1200);
    }
  }

  widthEl.addEventListener('input', function () { setWidth(widthEl.value); });

  widthVal.addEventListener('input', function () {
    // 지웠다 다시 쓰는 중일 수 있으니 빈 칸이나 이상한 값은 그냥 둔다
    if (widthVal.value === '' || !isFinite(Number(widthVal.value))) return;
    setWidth(widthVal.value, true);
  });
  // 다 쓰고 벗어나면 실제 적용된 값으로 정리해 준다 (70을 넣었으면 60으로)
  widthVal.addEventListener('blur', function () { widthVal.value = width; });
  widthVal.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); widthVal.blur(); }
  });

  document.getElementById('undoBtn').addEventListener('click', function () {
    send({ t: 'undo' });
  });

  document.addEventListener('keydown', function (e) {
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      send({ t: 'undo' });
    }
  });

  var clearCellBtn = document.getElementById('clearCellBtn');
  clearCellBtn.addEventListener('click', function () {
    if (confirm('내 칸에 그려진 것만 지웁니다. 되돌릴 수 없습니다. 계속할까요?')) {
      send({ t: 'clearCell' });
    }
  });

  /** 획 한 조각이 이 칸 안에 들어가는지 (server.js 의 segInCell 과 같은 규칙) */
  function segInCellC(o, cell) {
    var e = 1;
    return o.x0 >= cell.x0 - e && o.x0 <= cell.x1 + e && o.y0 >= cell.y0 - e && o.y0 <= cell.y1 + e &&
           o.x1 >= cell.x0 - e && o.x1 <= cell.x1 + e && o.y1 >= cell.y0 - e && o.y1 <= cell.y1 + e;
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    if (confirm('모두의 캔버스를 전부 지웁니다. 되돌릴 수 없습니다. 계속할까요?')) {
      send({ t: 'clear' });
    }
  });

  // ── 참여자 / 커서 ───────────────────────────────
  var peersEl = document.getElementById('peers');
  var cursors = {};   // id → {el, timer}
  var peersArr = [];  // 참여자 목록 (id 오름차순 — 칸 배정 순서와 같다)

  // ── 칸 나누기 ───────────────────────────────────
  var gridOn = false;
  var gridEl = document.getElementById('grid');
  var gridBtn = document.getElementById('gridBtn');

  // 서버와 같은 규칙으로 계산해야 배정이 어긋나지 않는다
  function layoutFor(n) {
    var cols = Math.max(1, Math.ceil(Math.sqrt(n)));
    return { cols: cols, rows: Math.max(1, Math.ceil(n / cols)) };
  }

  function cellOfIndex(idx, n) {
    var L = layoutFor(n);
    var cw = CW / L.cols, ch = CH / L.rows;
    var cx = idx % L.cols, cy = Math.floor(idx / L.cols);
    return { x0: cx * cw, y0: cy * ch, x1: (cx + 1) * cw, y1: (cy + 1) * ch };
  }

  function myCell() {
    if (!gridOn || me.id == null) return null;
    for (var i = 0; i < peersArr.length; i++) {
      if (peersArr[i].id === me.id) return cellOfIndex(i, peersArr.length);
    }
    return null;
  }

  /** 내 칸 밖으로 나가는 점을 칸 경계 안쪽으로 끌어당긴다(붓 굵기만큼 여유). */
  function clampToCell(p) {
    var c = myCell();
    if (!c) return p;
    var m = width / 2;
    var x0 = c.x0 + m, x1 = c.x1 - m, y0 = c.y0 + m, y1 = c.y1 - m;
    if (x0 > x1) x0 = x1 = (c.x0 + c.x1) / 2;
    if (y0 > y1) y0 = y1 = (c.y0 + c.y1) / 2;
    return { x: Math.min(x1, Math.max(x0, p.x)), y: Math.min(y1, Math.max(y0, p.y)) };
  }

  function renderGrid() {
    gridEl.classList.toggle('on', gridOn);
    clearCellBtn.style.display = (gridOn && myCell()) ? '' : 'none';
    gridEl.innerHTML = '';
    if (!gridOn) return;

    var n = peersArr.length;
    for (var i = 0; i < n; i++) {
      var p = peersArr[i];
      var c = cellOfIndex(i, n);
      var el = document.createElement('div');
      el.className = 'cell' + (p.id === me.id ? ' mine' : '');
      el.style.left = (c.x0 / CW * 100) + '%';
      el.style.top = (c.y0 / CH * 100) + '%';
      el.style.width = ((c.x1 - c.x0) / CW * 100) + '%';
      el.style.height = ((c.y1 - c.y0) / CH * 100) + '%';
      if (p.id === me.id) el.style.borderColor = p.color;

      var tag = document.createElement('b');
      tag.style.background = p.color;
      tag.textContent = p.name + (p.id === me.id ? ' (나)' : '');
      el.appendChild(tag);
      gridEl.appendChild(el);
    }
  }

  gridBtn.addEventListener('click', function () {
    send({ t: 'grid', on: !gridOn });

  function renderPeers(list) {
    peersArr = list.slice().sort(function (a, b) { return a.id - b.id; });

  function removeCursor(id) {
    if (!cursors[id]) return;

  function moveCursor(id, x, y, peer) {
    var c = cursors[id];

      el.appendChild(dot);

    // 캔버스가 화면 크기에 따라 늘어나므로 위치는 비율(%)로 지정한다
    c.el.style.left = (x / CW * 100) + '%';
    c.el.style.top = (y / CH * 100) + '%';

    clearTimeout(c.timer);
    c.timer = setTimeout(function () { removeCursor(id); }, 6000);
  }

  // ── 채팅 ────────────────────────────────────────

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function addChat(m) {
    var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;

    line.appendChild(who);

    if (m.image) {

    } else if (m.imageDropped) {
      line.appendChild(el('div', 'imgGone', '(오래된 이미지는 메모리 절약을 위해 지워졌습니다)'));
    }

    // 나를 지목한 메시지는 눈에 띄게
    if (m.mentions && m.mentions.indexOf(me.id) >= 0) line.classList.add('mention');

    log.appendChild(line);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  /** 본문에서 @이름 을 찾아 강조 표시로 바꾼다 (정규식 대신 직접 훑는다 — 이름에 특수문자가 있어도 안전) */
  function buildChatBody(text) {
    var frag = document.createDocumentFragment();
    var names = peersArr.map(function (x) { return x.name; })
      .concat(['전체', 'all', 'everyone'])
      .filter(Boolean)
      .sort(function (a, b) { return b.length - a.length; });

    var buf = '', i = 0;
    function flush() { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ''; } }

    while (i < text.length) {
      if (text.charAt(i) === '@') {
        var hit = null;
        for (var k = 0; k < names.length; k++) {
          if (text.substr(i + 1, names[k].length) === names[k]) { hit = names[k]; break; }
        }
        if (hit) {
          flush();
          frag.appendChild(el('span', 'mtag', '@' + hit));
          i += hit.length + 1;
          continue;
        }
      }
      buf += text.charAt(i);
      i++;
    }
    flush();
    return frag;
  }

  function addSys(text) {
    var line = document.createElement('div');
    line.className = 'line sys';
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function sendChat(image) {
    var text = chatInput.value.trim();
    if (!text && !image) return;
    send({ t: 'chat', text: text, image: image || undefined });
    chatInput.value = '';
    chatInput.style.height = 'auto';
    hideMentions();
  }
  document.getElementById('sendBtn').addEventListener('click', function () { sendChat(); });

  // ── @ 자동완성 ─────────────────────────────────
  var mentionBox = document.getElementById('mentionBox');
  var mentionList = [], mentionAt = -1;

  function mentionQuery() {
    var v = chatInput.value, pos = chatInput.selectionStart;
    var upto = v.slice(0, pos);
    var at = upto.lastIndexOf('@');
    if (at < 0) return null;
    var word = upto.slice(at + 1);
    if (/[\s@]/.test(word)) return null;
    return { q: word, start: at, end: pos };
  }

  function hideMentions() { mentionBox.classList.remove('on'); mentionList = []; mentionAt = -1; }

  function showMentions() {
    var q = mentionQuery();
    if (!q) { hideMentions(); return; }
    var lower = q.q.toLowerCase();
    var names = peersArr.map(function (x) { return x.name; })
      .concat(['전체'])
      .filter(function (nm) { return nm && (!lower || nm.toLowerCase().indexOf(lower) === 0); });

    mentionList = names.slice(0, 6);
    if (!mentionList.length) { hideMentions(); return; }
    mentionAt = 0;
    drawMentions();
  }

  function drawMentions() {
    mentionBox.innerHTML = '';
    mentionList.forEach(function (nm, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = '@' + nm;
      if (i === mentionAt) b.className = 'sel';
      b.addEventListener('mousedown', function (ev) { ev.preventDefault(); applyMention(nm); });
      mentionBox.appendChild(b);
    });
    mentionBox.classList.add('on');
  }

  function applyMention(nm) {
    var q = mentionQuery();
    if (!q) { hideMentions(); return; }
    var v = chatInput.value;
    chatInput.value = v.slice(0, q.start) + '@' + nm + ' ' + v.slice(q.end);
    var caret = q.start + nm.length + 2;
    chatInput.setSelectionRange(caret, caret);
    hideMentions();
    chatInput.focus();
  }

  chatInput.addEventListener('keydown', function (e) {
    if (mentionBox.classList.contains('on') && mentionList.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); mentionAt = (mentionAt + 1) % mentionList.length; drawMentions(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); mentionAt = (mentionAt - 1 + mentionList.length) % mentionList.length; drawMentions(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); applyMention(mentionList[mentionAt]); return; }
      if (e.key === 'Escape') { e.preventDefault(); hideMentions(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  chatInput.addEventListener('blur', function () { setTimeout(hideMentions, 120); });

  // ── 이미지 전송 ────────────────────────────────
  var MAX_IMG_LEN = 480000;   // 서버 한도(500KB)보다 살짝 낮게

  /** 이미지·캔버스·영상 프레임을 적당한 크기의 JPEG 데이터로 만든다 */
  function packImage(src, cb) {
    var w = src.videoWidth || src.naturalWidth || src.width;
    var h = src.videoHeight || src.naturalHeight || src.height;
    if (!w || !h) { cb(null); return; }

    var k = Math.min(1, 1000 / Math.max(w, h));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k));
    c.height = Math.max(1, Math.round(h * k));
    var g = c.getContext('2d');
    g.fillStyle = '#fff';                      // 투명 배경은 흰색으로 채운다
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(src, 0, 0, c.width, c.height);

    var q = 0.72;
    var out = c.toDataURL('image/jpeg', q);
    while (out.length > MAX_IMG_LEN && q > 0.34) {
      q -= 0.12;
      out = c.toDataURL('image/jpeg', q);
    }
    cb(out.length > MAX_IMG_LEN ? null : out);
  }

  function sendPacked(src) {
    packImage(src, function (d) {
      if (d) sendChat(d);
      else addSys('이미지가 너무 커서 전송하지 못했습니다');
    });
  }

  function sendImageFile(file) {
    if (!file) return;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { sendPacked(img); URL.revokeObjectURL(url); };
    img.onerror = function () { addSys('이미지를 읽을 수 없습니다'); URL.revokeObjectURL(url); };
    img.src = url;
  }

  var picInput = document.getElementById('picInput');
  document.getElementById('picBtn').addEventListener('click', function () { picInput.click(); });
  picInput.addEventListener('change', function () {
    sendImageFile(this.files && this.files[0]);
    this.value = '';
  });

  // 붙여넣기로도 보낼 수 있다
  chatInput.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) {
        var f = items[i].getAsFile();
        if (f) { e.preventDefault(); sendImageFile(f); return; }
      }
    }
  });

  document.getElementById('capBoardBtn').addEventListener('click', function () {
    sendPacked(canvas);
  });

  document.getElementById('capScreenBtn').addEventListener('click', function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      addSys('이 브라우저에서는 화면 캡처를 쓸 수 없습니다');
      return;
    }
    navigator.mediaDevices.getDisplayMedia({ video: true }).then(function (stream) {
      var v = document.createElement('video');
      v.muted = true;
      v.srcObject = stream;
      function done() { stream.getTracks().forEach(function (t) { t.stop(); }); }
      v.onloadedmetadata = function () {
        v.play().then(function () {
          // 첫 프레임이 채워질 시간을 조금 준다
          setTimeout(function () {
            packImage(v, function (d) {
              done();
              if (d) sendChat(d);
              else addSys('캡처 이미지가 너무 커서 전송하지 못했습니다');
            });
          }, 250);
        }).catch(function () { done(); });
      };
    }).catch(function () {
      addSys('화면 캡처가 취소되었습니다');
    });
  });
  chatInput.addEventListener('input', function () {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(90, chatInput.scrollHeight) + 'px';
    showMentions();
  });
  chatInput.addEventListener('click', showMentions);

  // ── 화면 전환 (그림판 / 빙고) ────────────────────
  var modePaintBtn = document.getElementById('modePaint');
  var modeBingoBtn = document.getElementById('modeBingo');
  var bingoEl = document.getElementById('bingo');
  var toolbarEl = document.querySelector('.toolbar');
  var mode = 'paint';

  var modeLiarBtn = document.getElementById('modeLiar');
  var modeRaceBtn = document.getElementById('modeRace');
  var modeArchBtn = document.getElementById('modeArch');
  var modeWbBtn = document.getElementById('modeWb');
  var liarEl = document.getElementById('liar');
  var raceEl = document.getElementById('race');
  var archEl = document.getElementById('arch');

  function setMode(m) {
    mode = m;
    var paint = m === 'paint';
    wrap.style.display = paint ? '' : 'none';
    toolbarEl.style.display = paint ? '' : 'none';
    bingoEl.classList.toggle('on', m === 'bingo');
    liarEl.classList.toggle('on', m === 'liar');

  modePaintBtn.addEventListener('click', function () { setMode('paint'); });
  modeBingoBtn.addEventListener('click', function () { setMode('bingo'); });

  // ── 빙고 ────────────────────────────────────────
  var bingoState = null;
  var boardEl = document.getElementById('bingoBoard');
  var bStatus = document.getElementById('bingoStatus');
  var bScores = document.getElementById('bingoScores');
  var bCalled = document.getElementById('bingoCalled');
  var bOrder = document.getElementById('bingoOrder');
  var bTimer = document.getElementById('bingoTimer');
  var bingoDeadline = 0;   // 내 시계 기준 차례 마감 시각

  // 남은 시간은 화면에서 매끄럽게 흐르도록 로컬에서 센다
  setInterval(function () {
    var s = bingoState;
    if (!s || !s.on || s.over || !bingoDeadline) {
      bTimer.textContent = '';
      bTimer.className = 'turnbar';
      return;
    }
    var left = Math.max(0, bingoDeadline - Date.now());
    bTimer.textContent = '남은 시간 ' + (left / 1000).toFixed(1) + '초 — 지나면 자동으로 선택됩니다';

    send({

  // 판 크기에 따라 고를 수 있는 줄 수가 달라진다 (가로+세로+대각선)
  function syncGoalOptions() {
    var max = Number(bSize.value) * 2 + 2;
    var keep = Number(bGoal.value);
    bGoal.innerHTML = '';
    for (var i = 1; i <= max; i++) {
      var o = document.createElement('option');
      o.value = i;
      o.textContent = i + '줄';
      bGoal.appendChild(o);
    }
    bGoal.value = Math.min(keep, max);
  }
  bSize.addEventListener('change', syncGoalOptions);
  syncGoalOptions();
  bGoal.value = 3;

  function renderBingo() {
    var s = bingoState;
    boardEl.innerHTML = '';
    bScores.innerHTML = '';
    bStatus.innerHTML = '';
    bOrder.innerHTML = '';

    if (!s || !s.on) {
      bStatus.textContent = '빙고가 시작되지 않았습니다 — 판 크기와 목표 줄 수를 고르고 게임 시작을 누르세요';
      bCalled.textContent = '';
      return;
    }

    var myTurn = s.turn === me.id && !s.over;

    // 상태 문구
    if (s.over) {
      var names = s.winners.map(function (w) { return w.name; }).join(', ');
      var w1 = document.createElement('span');
      w1.className = 'win';
      w1.textContent = '🎉 ' + names;
      bStatus.appendChild(w1);
      bStatus.appendChild(document.createTextNode(' 님 빙고! (' + s.goal + '줄 달성)'));
    } else {
      var hl = document.createElement('span');
      hl.className = 'hl';
      hl.textContent = myTurn ? '내 차례입니다' : s.turnName + ' 님 차례';
      bStatus.appendChild(hl);
      bStatus.appendChild(document.createTextNode(
        myTurn ? ' — 부를 숫자를 고르세요' : ' — 기다리는 중 (' + s.goal + '줄 빙고)'
      ));
    }

    // 판
    boardEl.style.gridTemplateColumns = 'repeat(' + s.size + ', minmax(0, 1fr))';
    boardEl.style.width = 'min(' + (s.size * 84) + 'px, 62vh, 86vw)';
    boardEl.classList.toggle('myturn', myTurn);

    var called = {};
    for (var i = 0; i < s.called.length; i++) called[s.called[i]] = true;

    (s.board || []).forEach(function (n) {
      var cell = document.createElement('div');
      cell.className = 'num' + (called[n] ? ' hit' : '');
      cell.textContent = n;
      if (!called[n]) {
        cell.addEventListener('click', function () {
          if (bingoState && bingoState.turn === me.id && !bingoState.over) {
            send({ t: 'bingo', act: 'call', n: n });
          }
        });
      }
      boardEl.appendChild(cell);
    });

    // 점수판
    s.players.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 's' + (p.id === s.turn && !s.over ? ' turn' : '');
      var dot = document.createElement('i');
      dot.style.background = p.color;
      var em = document.createElement('em');
      em.textContent = p.lines + '줄';
      el.appendChild(dot);
      el.appendChild(document.createTextNode(p.name + (p.id === me.id ? ' (나)' : '') + ' '));
      el.appendChild(em);
      bScores.appendChild(el);

    bCalled.textContent = s.called.length

  // ── 라이어 게임 ─────────────────────────────────
  var liarState = null;

        if (p.voted) b.appendChild(el('span', 'done', '✓'));

        var blocked = s.spectator || s.myVote != null || p.id === me.id;
        b.disabled = blocked;

        }
        box.appendChild(b);
      });

        s.spectator ? '관전 중이라 투표할 수 없습니다'
          : s.myVote != null ? '투표했습니다. 나머지를 기다리는 중…'

    // ── 라이어의 최후 기회

      if (s.isLiar) {

      } else {

      }
      return;
    }

    // ── 결과
    if (s.phase === 'done' && s.result) {
      var r = s.result;
      lPhase.textContent = '결과';

      var box2 = el('div', 'resultBox');
      box2.appendChild(el('div', 'big ' + (r.citizensWin ? 'citizen' : 'liarwin'),
        r.citizensWin ? '🔎 시민 승리!' : '🕵 라이어 승리!'));

      var d = el('div', 'detail');
