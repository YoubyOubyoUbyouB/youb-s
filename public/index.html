        d.appendChild(el('b', null, value));
        d.appendChild(document.createElement('br'));
      }
      line('라이어는', r.liarName + ' 님' + (r.fool ? ' (바보 라이어 — 본인도 몰랐습니다)' : ''));
      line('진짜 제시어는', r.word + ' (' + r.category + ')');
      if (r.fool) line('라이어가 받은 가짜 제시어', r.decoyWord + ' (' + r.decoyCategory + ')');
      if (r.guess != null) {
        line('라이어의 추측', r.guess + (r.guessCorrect ? ' (정답!)' : ' (오답)'));
      }
      if (r.tie) {
        d.appendChild(document.createTextNode('동점이라 지목에 실패했습니다'));
        d.appendChild(document.createElement('br'));
      }
      if (r.counts && r.counts.length) {
        d.appendChild(document.createTextNode('득표 — ' +
          r.counts.map(function (c) { return c.name + ' ' + c.n + '표'; }).join(', ')));
      }
      box2.appendChild(d);
      lBody.appendChild(box2);
      lBody.appendChild(el('div', 'turns', '게임 시작을 다시 누르면 새 판이 시작됩니다'));
    }
  }

  // ── 레이싱 ──────────────────────────────────────
  // ※ 아래 RC / TRACK 값은 server.js 와 반드시 같아야 한다.
  //    내 차를 로컬에서 미리 굴려(예측) 지연을 감추기 때문에, 한쪽만 바뀌면 차가 튄다.
  var RC = {
    maxSpeed: 520, grassMax: 170,
    accel: 430, brake: 620, revMax: 180,
    turn: 3.1, drag: 0.992, grassDrag: 0.90,
    carR: 15,
  };

  // 트랙 좌표는 서버가 레이스를 시작할 때 내려준다 (여기서 만들지 않는다)
  var TRACK = null;
  var halfWidth = 92;

  var rCanvas = document.getElementById('raceCanvas');
  var rc = rCanvas.getContext('2d');
  rCanvas.width = CW; rCanvas.height = CH;
  var trackWrap = document.getElementById('trackWrap');
  var raceBig = document.getElementById('raceBig');
  var raceStatus = document.getElementById('raceStatus');
  var raceStand = document.getElementById('raceStandings');

  function fitTrack() {
    var stage = raceEl.parentElement;
    var aw = stage.clientWidth - 28;
    var ah = stage.clientHeight - 155;
    if (aw <= 0 || ah <= 0) return;
    var s = Math.min(aw / CW, ah / CH);
    trackWrap.style.width = Math.max(320, Math.floor(CW * s)) + 'px';
    trackWrap.style.height = Math.max(180, Math.floor(CH * s)) + 'px';
  }
  window.addEventListener('resize', fitTrack);

  var raceState = null;     // 서버가 보내 준 최신 스냅샷
  var view = {};            // id → 화면에 그릴 위치 (서버 값으로 부드럽게 따라간다)
  var myCar = null;         // 내 차의 로컬 예측 상태
  var keys = { u: false, d: false, l: false, r: false };
  var lastSent = '';

  function distToRoadC(x, y) {
    if (!TRACK) return 0;
    var best = Infinity, n = TRACK.length;
    for (var i = 0; i < n; i++) {
      var a = TRACK[i], b = TRACK[(i + 1) % n];
      var vx = b.x - a.x, vy = b.y - a.y;
      var len2 = vx * vx + vy * vy;
      var t = len2 ? ((x - a.x) * vx + (y - a.y) * vy) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      var d = Math.hypot(x - (a.x + vx * t), y - (a.y + vy * t));
      if (d < best) best = d;
    }
    return best;
  }

  // server.js 의 stepCar 와 동일한 계산
  function stepLocal(car, dt) {
    var onRoad = distToRoadC(car.x, car.y) <= halfWidth;
    var top = onRoad ? RC.maxSpeed : RC.grassMax;

    if (keys.u) car.speed += RC.accel * dt;
    if (keys.d) car.speed -= RC.brake * dt;
    if (!keys.u && !keys.d) car.speed *= onRoad ? RC.drag : RC.grassDrag;
    else if (!onRoad) car.speed *= RC.grassDrag;

    if (car.speed > top) car.speed = top;
    if (car.speed < -RC.revMax) car.speed = -RC.revMax;
    if (Math.abs(car.speed) < 3) car.speed = 0;

    var grip = Math.min(1, Math.abs(car.speed) / 140);
    var dir = car.speed < 0 ? -1 : 1;
    if (keys.l) car.a -= RC.turn * dt * grip * dir;
    if (keys.r) car.a += RC.turn * dt * grip * dir;

    car.x += Math.cos(car.a) * car.speed * dt;
    car.y += Math.sin(car.a) * car.speed * dt;
    car.x = Math.min(CW - 20, Math.max(20, car.x));
    car.y = Math.min(CH - 20, Math.max(20, car.y));
  }

  function angLerp(a, b, t) {
    var d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  // ── 키 입력
  var KEYMAP = {
    ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd',
    ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
  };
  function onKey(e, down) {
    if (mode !== 'race') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    var k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (keys[k] === down) return;
    keys[k] = down;
    pushInput();
  }
  document.addEventListener('keydown', function (e) { onKey(e, true); });
  document.addEventListener('keyup', function (e) { onKey(e, false); });
  window.addEventListener('blur', function () {
    keys = { u: false, d: false, l: false, r: false };
    pushInput();
  });

  function pushInput(force) {
    var sig = (keys.u ? 1 : 0) + '' + (keys.d ? 1 : 0) + (keys.l ? 1 : 0) + (keys.r ? 1 : 0);
    if (!force && sig === lastSent) return;
    lastSent = sig;
    send({ t: 'race', act: 'input', u: keys.u, d: keys.d, l: keys.l, r: keys.r });
  }

  document.getElementById('raceStart').addEventListener('click', function () {
    if (raceState && raceState.on && raceState.phase !== 'done' &&
        !confirm('진행 중인 레이스가 있습니다. 새로 시작할까요?')) return;
    send({
      t: 'race', act: 'start',
      laps: Number(document.getElementById('raceLaps').value),
      track: Number(document.getElementById('raceTrack').value),   // -1 이면 서버가 랜덤으로 고른다
    });
  });
  document.getElementById('raceEnd').addEventListener('click', function () {
    if (confirm('레이스를 종료할까요?')) send({ t: 'race', act: 'end' });
  });

  // ── 그리기
  function drawTrack() {
    rc.fillStyle = '#16351f';                       // 잔디
    rc.fillRect(0, 0, CW, CH);

    if (!TRACK) {                                   // 아직 트랙을 받기 전
      rc.fillStyle = 'rgba(255,255,255,.45)';
      rc.font = 'bold 26px "Malgun Gothic", sans-serif';
      rc.textAlign = 'center';
      rc.fillText('트랙과 바퀴 수를 고르고 레이스 시작을 누르세요', CW / 2, CH / 2);
      return;
    }

    function path() {
      rc.beginPath();
      rc.moveTo(TRACK[0].x, TRACK[0].y);
      for (var i = 1; i < TRACK.length; i++) rc.lineTo(TRACK[i].x, TRACK[i].y);
      rc.closePath();
    }
    rc.lineJoin = 'round';
    rc.lineCap = 'round';

    path();
    rc.strokeStyle = '#0e1116';                     // 도로 테두리
    rc.lineWidth = halfWidth * 2 + 10;
    rc.stroke();

    path();
    rc.strokeStyle = '#3b4149';                     // 도로
    rc.lineWidth = halfWidth * 2;
    rc.stroke();

    path();                                         // 가운데 점선
    rc.setLineDash([26, 24]);
    rc.strokeStyle = 'rgba(255,255,255,.18)';
    rc.lineWidth = 3;
    rc.stroke();
    rc.setLineDash([]);

    // 출발·결승선 (체크무늬)
    var a = TRACK[0], b = TRACK[1];
    var len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    var dx = (b.x - a.x) / len, dy = (b.y - a.y) / len;
    var nx = -dy, ny = dx;
    var cells = 10, cw = (halfWidth * 2) / cells;
    for (var i = 0; i < cells; i++) {
      for (var j = 0; j < 2; j++) {
        rc.fillStyle = ((i + j) % 2) ? '#ffffff' : '#22262c';
        var off = -halfWidth + i * cw;
        var px = a.x + nx * off + dx * (j * 11 - 11);
        var py = a.y + ny * off + dy * (j * 11 - 11);
        rc.save();
        rc.translate(px, py);
        rc.rotate(Math.atan2(dy, dx));
        rc.fillRect(-5.5, 0, 11, cw);
        rc.restore();
      }
    }
  }

  function drawCar(x, y, ang, color, name, isMe, finished) {
    rc.save();
    rc.translate(x, y);
    rc.rotate(ang);
    rc.globalAlpha = finished ? 0.45 : 1;

    rc.fillStyle = 'rgba(0,0,0,.35)';               // 그림자
    rc.fillRect(-15, -9, 32, 20);

    rc.fillStyle = color;                            // 차체
    rc.strokeStyle = isMe ? '#fff' : 'rgba(0,0,0,.6)';
    rc.lineWidth = isMe ? 2.5 : 1.5;
    rc.beginPath();
    rc.rect(-16, -10, 32, 20);
    rc.fill();
    rc.stroke();

    rc.fillStyle = 'rgba(255,255,255,.75)';          // 앞유리
    rc.fillRect(2, -7, 8, 14);
    rc.restore();

    rc.globalAlpha = finished ? 0.5 : 1;
    rc.font = 'bold 13px "Malgun Gothic", sans-serif';
    rc.textAlign = 'center';
    rc.lineWidth = 3;
    rc.strokeStyle = 'rgba(0,0,0,.8)';
    rc.strokeText(name, x, y - 20);
    rc.fillStyle = '#fff';
    rc.fillText(name, x, y - 20);
    rc.globalAlpha = 1;
  }

  function drawScene(dt) {
    var s = raceState;
    drawTrack();
    if (!s || !s.on) return;

    // 내 차는 로컬에서 계속 굴린다 → 키를 누르면 즉시 반응한다
    if (dt && myCar && s.phase === 'racing' && !myCar.finished) stepLocal(myCar, dt);

    s.cars.forEach(function (c) {
      var mine = c.i === me.id;
      var v = view[c.i];
      if (!v) v = view[c.i] = { x: c.x, y: c.y, a: c.a };

      if (mine && myCar) {
        v.x = myCar.x; v.y = myCar.y; v.a = myCar.a;
      } else {
        v.x += (c.x - v.x) * Math.min(1, dt * 14);   // 남의 차는 부드럽게 따라간다
        v.y += (c.y - v.y) * Math.min(1, dt * 14);
        v.a = angLerp(v.a, c.a, Math.min(1, dt * 14));
      }
      drawCar(v.x, v.y, v.a, c.c, c.n, mine, c.f);
    });
  }

  var lastFrame = 0;
  function raceFrame(ts) {
    requestAnimationFrame(raceFrame);
    var dt = lastFrame ? Math.min(0.05, (ts - lastFrame) / 1000) : 0;
    lastFrame = ts;
    if (mode === 'race') drawScene(dt);
  }
  requestAnimationFrame(raceFrame);

  var lastHud = 0;

  /**
   * 서버가 보내 준 내 차 위치로 로컬 예측을 보정한다.
   * 내 입력이 서버에 도착하는 데 시간이 걸려서 로컬이 항상 조금 앞서 있는데,
   * 이걸 매번 강하게 맞추면 차가 뒤로 끌려가 덜컹거린다. 그래서 평소엔 아주 약하게만
   * 당기고, 충돌 등으로 크게 어긋났을 때만 서버 위치로 붙인다.
   */
  function syncMyCar(m) {
    // 트랙은 레이스 시작 때만 내려온다. 한 번 받으면 계속 들고 쓴다.
    if (m.track) { TRACK = m.track; halfWidth = m.halfWidth || 92; }
    if (!m.on) { myCar = null; view = {}; return; }

    var srv = null;
    m.cars.forEach(function (c) { if (c.i === me.id) srv = c; });
    if (!srv) { myCar = null; return; }

    if (!myCar || m.phase === 'countdown' || srv.f) {
      myCar = { x: srv.x, y: srv.y, a: srv.a, speed: srv.s, finished: srv.f };
      return;
    }
    myCar.finished = srv.f;

    if (Math.hypot(srv.x - myCar.x, srv.y - myCar.y) > 120) {
      myCar.x = srv.x; myCar.y = srv.y; myCar.a = srv.a; myCar.speed = srv.s;
    } else {
      myCar.x += (srv.x - myCar.x) * 0.06;
      myCar.y += (srv.y - myCar.y) * 0.06;
      myCar.a = angLerp(myCar.a, srv.a, 0.06);
      myCar.speed += (srv.s - myCar.speed) * 0.2;
    }
  }

  function fmt(ms) {
    if (ms == null) return '—';
    return (ms / 1000).toFixed(2) + '초';
  }

  function renderRace() {
    var s = raceState;
    raceStand.innerHTML = '';
    raceBig.style.display = 'none';

    if (!s || !s.on) {
      raceStatus.textContent = '레이스가 시작되지 않았습니다';
      myCar = null; view = {};
      return;
    }

    if (s.phase === 'countdown') {
      raceStatus.textContent = '「' + s.trackName + '」 ' + s.laps + '바퀴 · 곧 출발합니다';
      raceBig.style.display = '';
      raceBig.innerHTML = '';
      raceBig.appendChild(document.createTextNode(String(Math.ceil(s.countdown / 1000) || 'GO!')));
      var sm = document.createElement('small');
      sm.textContent = '방향키를 준비하세요';
      raceBig.appendChild(sm);
    } else if (s.phase === 'racing') {
      var mine = null;
      s.cars.forEach(function (c) { if (c.i === me.id) mine = c; });
      raceStatus.textContent = '「' + s.trackName + '」 ' + (mine
        ? (mine.f ? '완주! 다른 사람을 기다리는 중' : (mine.r + '위 · ' + Math.min(s.laps, mine.l + 1) + ' / ' + s.laps + '바퀴'))
        : '관전 중 (다음 판부터 참여)');
    } else if (s.phase === 'done') {
      raceStatus.textContent = '레이스 종료';
      raceBig.style.display = '';
      raceBig.innerHTML = '';
      raceBig.appendChild(document.createTextNode('🏁'));
      var sm2 = document.createElement('small');
      var win = s.results && s.results[0];
      sm2.textContent = win ? (win.name + ' 님 우승 — ' + fmt(win.time)) : '';
      raceBig.appendChild(sm2);
    }

    var rows = (s.phase === 'done' && s.results) ? s.results
      : s.cars.slice().sort(function (a, b) { return a.r - b.r; }).map(function (c) {
          return { id: c.i, name: c.n, color: c.c, rank: c.r, lap: c.l, best: c.b, finished: c.f, time: null };
        });

    rows.forEach(function (p) {
      var el2 = document.createElement('div');
      el2.className = 'r' + (p.id === me.id ? ' me' : '') + (p.finished ? ' fin' : '');
      var dot = document.createElement('i');
      dot.style.background = p.color;
      el2.appendChild(dot);
      el2.appendChild(document.createTextNode(p.rank + '위 ' + p.name + (p.id === me.id ? '(나)' : '') + ' '));
      var em = document.createElement('em');
      em.textContent = (s.phase === 'done')
        ? (p.finished ? fmt(p.time) : p.lap + '바퀴')
        : (p.lap + '바퀴' + (p.best ? ' · 최고 ' + fmt(p.best) : ''));
      el2.appendChild(em);
      raceStand.appendChild(el2);
    });
  }

  // ── 활쏘기 ──────────────────────────────────────
  // 물리·점수 판정은 전부 서버가 한다. 여기서는 조준 미리보기와 그리기만 담당한다.
  var aCanvas = document.getElementById('archCanvas');
  var ac = aCanvas.getContext('2d');
  aCanvas.width = CW; aCanvas.height = CH;
  var archWrap = document.getElementById('archWrap');
  var archStatus = document.getElementById('archStatus');
  var archTimer = document.getElementById('archTimer');
  var archScores = document.getElementById('archScores');

  var archState = null;
  var archDeadline = 0;
  var aim = null;            // { x, y } 드래그 중인 지점
  var flight = null;         // { pts, i, color, score }
  var lastShotId = 0;

  function fitArch() {
    var stage = archEl.parentElement;
    var aw = stage.clientWidth - 28;
    var ah = stage.clientHeight - 190;
    if (aw <= 0 || ah <= 0) return;
    var k = Math.min(aw / CW, ah / CH);
    archWrap.style.width = Math.max(320, Math.floor(CW * k)) + 'px';
    archWrap.style.height = Math.max(180, Math.floor(CH * k)) + 'px';
  }
  window.addEventListener('resize', fitArch);

  function archTargetY() {
    var s = archState;
    if (!s || !s.on || !s.moving) return s && s.on ? s.geo.centerY : 460;
    var off = (s.mvOff + (Date.now() - archRecvAt)) % s.geo.movePeriod;
    return s.geo.centerY + s.geo.moveAmp * Math.sin(off / s.geo.movePeriod * Math.PI * 2);
  }
  var archRecvAt = 0;

  function archToCanvas(ev) {
    var r = aCanvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * CW,
      y: (ev.clientY - r.top) / r.height * CH,
    };
  }

  /**
   * 드래그 지점에서 각도·힘을 뽑는다.
   * 앞으로 당기든 뒤로 당기든 화살은 항상 과녁 쪽(오른쪽)으로 날아가도록
   * 가로 성분은 절댓값을 쓴다. 위아래로 당긴 정도만 각도에 반영된다.
   */
  function aimFrom(pt) {
    var g = archState.geo;
    var dx = Math.abs(g.bowX - pt.x);      // 방향 상관없이 항상 앞쪽
    var dy = g.bowY - pt.y;
    var len = Math.hypot(dx, dy);
    if (len < 1) return null;
    var angle = Math.atan2(dy, dx);
    angle = Math.max(-1.5, Math.min(0.35, angle));
    var power = Math.max(0.15, Math.min(1, len / 240));
    return { angle: angle, power: power };
  }

  function myArchTurn() {
    var s = archState;
    return !!(s && s.on && s.phase === 'aim' && s.turn === me.id);
  }

  aCanvas.addEventListener('pointerdown', function (ev) {
    if (!myArchTurn()) return;
    try { aCanvas.setPointerCapture(ev.pointerId); } catch (e) {}
    aim = archToCanvas(ev);
  });
  aCanvas.addEventListener('pointermove', function (ev) {
    if (!aim) return;
    aim = archToCanvas(ev);
  });
  function releaseAim(ev) {
    if (!aim) return;
    var a = aimFrom(aim);
    aim = null;
    try {
      if (ev && ev.pointerId != null && aCanvas.hasPointerCapture(ev.pointerId)) {
        aCanvas.releasePointerCapture(ev.pointerId);
      }
    } catch (e) {}
    if (a && myArchTurn()) send({ t: 'arch', act: 'shoot', angle: a.angle, power: a.power });
  }
  aCanvas.addEventListener('pointerup', releaseAim);
  aCanvas.addEventListener('pointercancel', function () { aim = null; });
  aCanvas.addEventListener('pointerleave', releaseAim);

  document.getElementById('archStart').addEventListener('click', function () {
    if (archState && archState.on && archState.phase !== 'done' &&
        !confirm('진행 중인 활쏘기가 있습니다. 새로 시작할까요?')) return;
    send({
      t: 'arch', act: 'start',
      shots: Number(document.getElementById('archShots').value),
      dist: document.getElementById('archDist').value,
      wind: document.getElementById('archWind').value,
      moving: document.getElementById('archMove').value === '1',
      turnMs: Number(document.getElementById('archTurn').value),
    });
  });
  document.getElementById('archEnd').addEventListener('click', function () {
    if (confirm('활쏘기를 종료할까요?')) send({ t: 'arch', act: 'end' });
  });

  // ── 그리기
  function drawArch() {
    var s = archState;
    ac.fillStyle = '#101a2b';
    ac.fillRect(0, 0, CW, CH);

    if (!s || !s.on) {
      ac.fillStyle = 'rgba(255,255,255,.45)';
      ac.font = 'bold 26px "Malgun Gothic", sans-serif';
      ac.textAlign = 'center';
      ac.fillText('설정을 고르고 게임 시작을 누르세요', CW / 2, CH / 2);
      return;
    }
    var g = s.geo;

    // 땅
    ac.fillStyle = '#1d3a24';
    ac.fillRect(0, g.groundY, CW, CH - g.groundY);
    ac.strokeStyle = 'rgba(255,255,255,.15)';
    ac.lineWidth = 2;
    ac.beginPath(); ac.moveTo(0, g.groundY); ac.lineTo(CW, g.groundY); ac.stroke();

    // 바람 표시
    ac.font = 'bold 20px "Malgun Gothic", sans-serif';
    ac.textAlign = 'center';
    ac.fillStyle = s.wind ? '#93c5fd' : 'rgba(255,255,255,.35)';
    var wtxt = !s.wind ? '바람 없음'
      : (s.wind > 0 ? '→→ ' : '←← ') + Math.abs(Math.round(s.wind / 50) / 10) + ' 바람';
    ac.fillText(wtxt, CW / 2, 52);

    // 과녁
    var ty = archTargetY();
    var rings = [[1, '#f8fafc'], [0.8, '#111827'], [0.6, '#38bdf8'], [0.4, '#ef4444'], [0.2, '#fbbf24']];
    for (var i = 0; i < rings.length; i++) {
      ac.beginPath();
      ac.arc(g.targetX, ty, g.targetR * rings[i][0], 0, Math.PI * 2);
      ac.fillStyle = rings[i][1];
      ac.fill();
    }
    ac.strokeStyle = 'rgba(0,0,0,.6)';
    ac.lineWidth = 2;
    ac.beginPath(); ac.arc(g.targetX, ty, g.targetR, 0, Math.PI * 2); ac.stroke();
    // 받침대
    ac.strokeStyle = '#7c5a3a';
    ac.lineWidth = 8;
    ac.beginPath(); ac.moveTo(g.targetX, ty + g.targetR); ac.lineTo(g.targetX, g.groundY); ac.stroke();

    // 이미 꽂힌 화살
    (s.arrows || []).forEach(function (a) {
      ac.strokeStyle = a.c;
      ac.lineWidth = 3;
      ac.beginPath(); ac.moveTo(a.x - 26, a.y - 8); ac.lineTo(a.x, a.y); ac.stroke();
    });

    // 궁수
    ac.strokeStyle = '#e7eaf0';
    ac.lineWidth = 5;
    ac.beginPath();
    ac.arc(g.bowX - 30, g.bowY - 60, 16, 0, Math.PI * 2);          // 머리
    ac.stroke();
    ac.beginPath();
    ac.moveTo(g.bowX - 30, g.bowY - 44); ac.lineTo(g.bowX - 30, g.groundY - 60);
    ac.moveTo(g.bowX - 30, g.groundY - 60); ac.lineTo(g.bowX - 55, g.groundY);
    ac.moveTo(g.bowX - 30, g.groundY - 60); ac.lineTo(g.bowX - 5, g.groundY);
    ac.moveTo(g.bowX - 30, g.bowY - 20); ac.lineTo(g.bowX, g.bowY);
    ac.stroke();
    ac.strokeStyle = '#c2853f';                                     // 활
    ac.lineWidth = 6;
    ac.beginPath(); ac.arc(g.bowX, g.bowY, 42, -1.15, 1.15); ac.stroke();

    // 조준 미리보기
    if (aim && myArchTurn()) {
      var a = aimFrom(aim);
      if (a) {
        // 당기고 있는 방향 (가는 점선)
        ac.strokeStyle = 'rgba(255,255,255,.35)';
        ac.lineWidth = 2;
        ac.setLineDash([8, 8]);
        ac.beginPath(); ac.moveTo(g.bowX, g.bowY); ac.lineTo(aim.x, aim.y); ac.stroke();
        ac.setLineDash([]);

        // 서버와 같은 식으로 궤적을 미리 계산한다
        var v = g.vMax * a.power;
        var x = g.bowX, y = g.bowY;
        var vx = Math.cos(a.angle) * v, vy = Math.sin(a.angle) * v;
        var dt = 1 / 60;
        var path = [[x, y]];
        for (var k = 0; k < 260; k++) {
          vx += s.wind * dt; vy += g.gravity * dt;
          x += vx * dt; y += vy * dt;
          path.push([x, y]);
          if (y > g.groundY || x > CW) break;
        }

        // 굵게 두 번 겹쳐 그린다 — 어두운 테두리 위에 밝은 선
        ac.lineCap = 'round';
        ac.lineJoin = 'round';
        for (var pass = 0; pass < 2; pass++) {
          ac.strokeStyle = pass ? 'rgba(255,255,255,.92)' : 'rgba(0,0,0,.55)';
          ac.lineWidth = pass ? 7 : 13;
          ac.beginPath();
          ac.moveTo(path[0][0], path[0][1]);
          for (var q = 1; q < path.length; q++) ac.lineTo(path[q][0], path[q][1]);
          ac.stroke();
        }

        // 궤적 끝에 화살촉을 붙여 날아갈 방향을 분명히 보여 준다
        var e2 = path[path.length - 1], e1 = path[Math.max(0, path.length - 6)];
        var ea = Math.atan2(e2[1] - e1[1], e2[0] - e1[0]);
        ac.save();
        ac.translate(e2[0], e2[1]);
        ac.rotate(ea);
        ac.lineWidth = 7;
        ac.strokeStyle = 'rgba(0,0,0,.55)';
        ac.beginPath(); ac.moveTo(-26, -16); ac.lineTo(0, 0); ac.lineTo(-26, 16); ac.stroke();
        ac.lineWidth = 4;
        ac.strokeStyle = 'rgba(255,255,255,.92)';
        ac.beginPath(); ac.moveTo(-26, -16); ac.lineTo(0, 0); ac.lineTo(-26, 16); ac.stroke();
        ac.restore();

        // 힘 게이지
        ac.fillStyle = 'rgba(0,0,0,.5)';
        ac.fillRect(g.bowX - 60, g.bowY + 60, 220, 16);
        ac.fillStyle = a.power > 0.85 ? '#f87171' : '#4ade80';
        ac.fillRect(g.bowX - 58, g.bowY + 62, 216 * a.power, 12);
      }
    }

    // 날아가는 화살
    if (flight) {
      var pts = flight.pts;
      var idx = Math.min(pts.length - 1, Math.floor(flight.i));
      ac.strokeStyle = 'rgba(255,255,255,.25)';
      ac.lineWidth = 2;
      ac.beginPath();
      for (var q = 0; q <= idx; q++) {
        if (q === 0) ac.moveTo(pts[q][0], pts[q][1]);
        else ac.lineTo(pts[q][0], pts[q][1]);
      }
      ac.stroke();

      var pv = pts[Math.max(0, idx - 1)], cu = pts[idx];
      var ang = Math.atan2(cu[1] - pv[1], cu[0] - pv[0]);
      ac.save();
      ac.translate(cu[0], cu[1]);
      ac.rotate(ang);
      ac.strokeStyle = flight.color;
      ac.lineWidth = 4;
      ac.beginPath(); ac.moveTo(-28, 0); ac.lineTo(0, 0); ac.stroke();
      ac.beginPath(); ac.moveTo(-8, -6); ac.lineTo(0, 0); ac.lineTo(-8, 6); ac.stroke();
      ac.restore();
    }
  }

  var archLast = 0;
  function archFrame(ts) {
    requestAnimationFrame(archFrame);
    var dt = archLast ? Math.min(0.05, (ts - archLast) / 1000) : 0;
    archLast = ts;
    if (mode !== 'arch') return;
    if (flight) {
      flight.i += dt * 30;                     // 궤적은 1/30초 간격으로 기록돼 있다
      if (flight.i >= flight.pts.length - 1) flight = null;
    }
    drawArch();
  }
  requestAnimationFrame(archFrame);

  // 남은 시간 표시
  setInterval(function () {
    var s = archState;
    if (!s || !s.on || s.phase !== 'aim' || !archDeadline) {
      archTimer.textContent = '';
      archTimer.className = 'turnbar';
      return;
    }
    var left = Math.max(0, archDeadline - Date.now());
    archTimer.textContent = '남은 시간 ' + (left / 1000).toFixed(1) + '초 — 지나면 자동으로 발사됩니다';
    archTimer.className = 'turnbar' + (left < 4000 ? ' warn' : '');
  }, 200);

  function renderArch() {
    var s = archState;
    archScores.innerHTML = '';
    archStatus.innerHTML = '';

    if (!s || !s.on) {
      archStatus.textContent = '활쏘기가 시작되지 않았습니다 — 설정을 고르고 게임 시작을 누르세요';
      return;
    }

    if (s.phase === 'done') {
      var top = s.results && s.results[0];
      archStatus.appendChild(el('span', 'hl', '🏹 종료'));
      archStatus.appendChild(document.createTextNode(
        top ? ' — ' + top.name + ' 님 우승 (' + top.total + '점)' : ''));
    } else {
      var mine = null;
      s.players.forEach(function (x) { if (x.id === me.id) mine = x; });
      var head = myArchTurn() ? '내 차례' : s.turnName + ' 님 차례';
      archStatus.appendChild(el('span', 'hl', head));
      archStatus.appendChild(document.createTextNode(
        ' — ' + (mine ? (mine.shots.length + ' / ' + s.shotsPer + '발') : '관전 중') +
        (s.phase === 'fly' ? ' · 화살이 날아가는 중' : (myArchTurn() ? ' · 드래그해서 쏘세요' : ''))));
    }

    var rows = (s.phase === 'done' && s.results) ? s.results : s.players.slice().sort(function (a, b) {
      return b.total - a.total;
    });
    rows.forEach(function (pl, i) {
      var box = el('div', 'r' + (pl.id === me.id ? ' me' : '') + (pl.id === s.turn && s.phase !== 'done' ? ' turn' : ''));
      var dot = el('i');
      dot.style.background = pl.color;
      box.appendChild(dot);
      box.appendChild(document.createTextNode((i + 1) + '위 ' + pl.name + (pl.id === me.id ? '(나)' : '') + ' '));
      var em = el('em', null, pl.total + '점');
      box.appendChild(em);
      if (pl.shots && pl.shots.length) box.appendChild(el('span', null, ' (' + pl.shots.join('·') + ')'));
      archScores.appendChild(box);
    });
  }

  // ── 물풍선 ──────────────────────────────────────
  // 판정은 전부 서버가 한다. 여기서는 그리기와, 내 캐릭터만 미리 움직여 보는
  // 예측(prediction)을 담당한다. 서버 값이 오면 조금씩 그쪽으로 당겨 맞춘다.
  var wbCanvas = document.getElementById('wbCanvas');
  var wc = wbCanvas.getContext('2d');
  wbCanvas.width = CW; wbCanvas.height = CH;
  var wbWrap = document.getElementById('wbWrap');
  var wbStatusEl = document.getElementById('wbStatus');
  var wbStandEl = document.getElementById('wbStand');
  var wbBig = document.getElementById('wbBig');

  // 서버(server.js 의 WB)와 반드시 같아야 하는 값들
  var WBC = { half: 23, baseSpeed: 175, speedStep: 32, glide: 130 };

  var wbState = null;
  var wbMap = null;          // 숫자 배열 (0 빈칸 · 1 벽 · 2 상자)
  var wbMapStr = '';        // 바닥을 다시 그릴지 판단하는 열쇠
  var wbMine = null;         // 내 캐릭터의 예측 위치 { x, y, dir }
  var wbLast = 0;
  var wbHud = 0;

  // 서버가 매 틱 보내지 않는 것들은 받아서 들고 쓴다
  var wbMeta = { fuse: 3000, trapMs: 6500 };
  var wbWho = {};            // id → { n: 이름, c: 색 }

  // 남의 캐릭터는 20Hz 로 오는 서버 값 사이를 시간에 맞춰 채워 그린다.
  // 프레임마다 조금씩 따라가는 방식은 늘 뒤처지고 프레임률에 따라 속도가 달라진다.
  var wbLerp = {};           // id → { ax, ay, bx, by, t0, dur, last }

  // 벽·상자·바닥은 상자가 부서질 때만 바뀐다. 매 프레임 250칸을 다시 칠하지 않도록
  // 따로 그려 두고 통째로 붙인다.
  var wbBase = document.createElement('canvas');
  wbBase.width = CW; wbBase.height = CH;
  var wbBaseCtx = wbBase.getContext('2d');
  var wbBaseKey = null;

  function fitWb() {
    var stage = wbEl.parentElement;
    var aw = stage.clientWidth - 28;
    var ah = stage.clientHeight - 165;
    if (aw <= 0 || ah <= 0) return;
    var k = Math.min(aw / CW, ah / CH);
    wbWrap.style.width = Math.max(320, Math.floor(CW * k)) + 'px';
    wbWrap.style.height = Math.max(180, Math.floor(CH * k)) + 'px';
  }
  window.addEventListener('resize', fitWb);

  var wbG = null;   // { cols, rows, tile, ox, oy } — 서버가 알려 준 맵 규격
  function wbIdxC(tx, ty) { return ty * wbG.cols + tx; }
  function wbTX(px) { return Math.floor((px - wbG.ox) / wbG.tile); }
  function wbTY(py) { return Math.floor((py - wbG.oy) / wbG.tile); }
  function wbCXc(tx) { return wbG.ox + (tx + 0.5) * wbG.tile; }
  function wbCYc(ty) { return wbG.oy + (ty + 0.5) * wbG.tile; }
  function wbLeft(tx) { return wbG.ox + tx * wbG.tile; }
  function wbTop(ty) { return wbG.oy + ty * wbG.tile; }

  // ── 내 캐릭터 예측 (서버 wbMove 와 같은 규칙) ──
  function wbSolidC(tx, ty) {
    if (!wbMap || !wbG) return true;
    if (tx < 0 || ty < 0 || tx >= wbG.cols || ty >= wbG.rows) return true;
    var v = wbMap[wbIdxC(tx, ty)];
    if (v === 1 || v === 2) return true;
    var bs = wbState.balloons, i;
    for (i = 0; i < bs.length; i++) {
      if (bs[i][0] !== tx || bs[i][1] !== ty) continue;
      // 지금 그 칸 위에 서 있다면 (방금 내가 놓은 풍선) 통과
      if (wbTX(wbMine.x) === tx && wbTY(wbMine.y) === ty) return false;
      return true;
    }
    return false;
  }

  function wbBlockedC(x, y) {
    var h = WBC.half;
    var x0 = wbTX(x - h), x1 = wbTX(x + h);
    var y0 = wbTY(y - h), y1 = wbTY(y + h);
    for (var ty = y0; ty <= y1; ty++) {
      for (var tx = x0; tx <= x1; tx++) if (wbSolidC(tx, ty)) return true;
    }
    return false;
  }

  function wbStepC(dx, dy) {
    if (!dx && !dy) return false;
    if (wbBlockedC(wbMine.x + dx, wbMine.y + dy)) return false;
    wbMine.x += dx; wbMine.y += dy;
    return true;
  }

  function wbGlideC(axis, dt) {
    var cur = axis === 'x' ? wbMine.x : wbMine.y;
    var mid = axis === 'x' ? wbCXc(wbTX(wbMine.x)) : wbCYc(wbTY(wbMine.y));
    var d = mid - cur;
    if (Math.abs(d) < 0.5) return;
    var step = (d < 0 ? -1 : 1) * Math.min(Math.abs(d), WBC.glide * dt);
    if (axis === 'x') wbStepC(step, 0); else wbStepC(0, step);
  }

  function wbPredict(dt) {
    var s = wbState;
    if (!s || !s.on || s.phase !== 'play' || !wbMine || !wbMap) return;
    if (!wbMine.alive || wbMine.trapped) return;
    var vx = 0, vy = 0;
    if (wbKeys.l) vx -= 1;
    if (wbKeys.r) vx += 1;
    if (wbKeys.u) vy -= 1;
    if (wbKeys.d) vy += 1;
    if (!vx && !vy) return;
    if (vx && vy) { vx *= 0.7071; vy *= 0.7071; }
    wbMine.dir = vx ? (vx > 0 ? 'r' : 'l') : (vy > 0 ? 'd' : 'u');
    var sp = (WBC.baseSpeed + wbMine.speed * WBC.speedStep) * dt;
    var okX = wbStepC(vx * sp, 0);
    var okY = wbStepC(0, vy * sp);
    if (vx && !okX) wbGlideC('y', dt);
    if (vy && !okY) wbGlideC('x', dt);
  }

  /**
   * 서버 상태를 받아 정리한다.
   * - 이름·색·맵 규격은 서버가 바뀔 때만 보내므로 받아서 캐시에 넣는다
   * - 내 캐릭터는 예측값을 서버 값으로 살살 당겨 맞춘다 (많이 어긋나면 바로 붙인다)
   * - 남의 캐릭터는 보간용 구간(ax→bx)을 갱신한다
   */
  function wbSync(m) {
    if (m.map) { wbMapStr = m.map; wbMap = m.map.split('').map(Number); }
    if (m.cols) {
      wbG = { cols: m.cols, rows: m.rows, tile: m.tile, ox: m.ox, oy: m.oy };
      wbMeta = { fuse: m.fuse || 3000, trapMs: m.trapMs || 6500 };
    }
    if (!m.on) {
      wbMine = null; wbLerp = {}; wbWho = {};
      wbMap = null; wbMapStr = ''; wbG = null; wbBaseKey = null;
      return;
    }

    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var srv = null;

    for (var i = 0; i < m.players.length; i++) {
      var pl = m.players[i];
      if (pl.n) wbWho[pl.i] = { n: pl.n, c: pl.c };   // 이름·색이 실려 온 틱에만 갱신
      if (pl.i === me.id) { srv = pl; continue; }

      var v = wbLerp[pl.i];
      if (!v) {
        wbLerp[pl.i] = { ax: pl.x, ay: pl.y, bx: pl.x, by: pl.y, t0: now, dur: 50, last: now };
        continue;
      }
      // 새 판이 시작돼 자리가 튀면 보간하지 않고 바로 옮긴다
      if (Math.hypot(pl.x - v.bx, pl.y - v.by) > 300) {
        v.ax = v.bx = pl.x; v.ay = v.by = pl.y;
        v.t0 = now; v.dur = 50; v.last = now;
        continue;
      }
      var dur = now - v.last;
      if (!(dur > 10 && dur < 400)) dur = 50;   // 한 번 크게 끊겼으면 기본값으로
      v.ax = v.bx; v.ay = v.by;
      v.bx = pl.x; v.by = pl.y;
      v.t0 = now; v.dur = dur; v.last = now;
    }

    // 목록에서 사라진 사람은 보간 상태도 지운다
    var alive = {};
    for (var j = 0; j < m.players.length; j++) alive[m.players[j].i] = 1;
    for (var k in wbLerp) if (!alive[k]) delete wbLerp[k];

    if (!srv) { wbMine = null; return; }

    if (!wbMine || m.phase !== 'play' || !srv.a || srv.t) {
      wbMine = { x: srv.x, y: srv.y, dir: srv.d, speed: srv.sp, alive: srv.a, trapped: srv.t };
      return;
    }
    wbMine.speed = srv.sp;
    wbMine.alive = srv.a;
    wbMine.trapped = srv.t;
    if (Math.hypot(srv.x - wbMine.x, srv.y - wbMine.y) > 48) {
      wbMine.x = srv.x; wbMine.y = srv.y;
    } else {
      wbMine.x += (srv.x - wbMine.x) * 0.12;
      wbMine.y += (srv.y - wbMine.y) * 0.12;
    }
  }

  /** 남의 캐릭터를 지금 시각에 맞춰 어디에 그릴지 */
  function wbAt(id, fx, fy) {
    var v = wbLerp[id];
    if (!v) return { x: fx, y: fy };
    var now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var t = (now - v.t0) / v.dur;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    return { x: v.ax + (v.bx - v.ax) * t, y: v.ay + (v.by - v.ay) * t };
  }

  // ── 키 입력 ──
  // 물풍선은 방향키만 쓴다. W A S D 를 빼 두면 채팅을 치다가 캐릭터가 움직이는 일이 없다.
  var WB_KEYMAP = {
    ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r',
  };
  var wbKeys = { u: false, d: false, l: false, r: false };
  var wbSent = '';
  function wbPush(force) {
    var sig = (wbKeys.u ? 1 : 0) + '' + (wbKeys.d ? 1 : 0) + (wbKeys.l ? 1 : 0) + (wbKeys.r ? 1 : 0);
    if (!force && sig === wbSent) return;
    wbSent = sig;
    send({ t: 'wb', act: 'input', u: wbKeys.u, d: wbKeys.d, l: wbKeys.l, r: wbKeys.r });
  }
  function wbOnKey(e, down) {
    if (mode !== 'wb') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (down && !e.repeat) send({ t: 'wb', act: 'drop' });
      return;
    }
    var k = WB_KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (wbKeys[k] === down) return;
    wbKeys[k] = down;
    wbPush();
  }
  document.addEventListener('keydown', function (e) { wbOnKey(e, true); });
  document.addEventListener('keyup', function (e) { wbOnKey(e, false); });
  window.addEventListener('blur', function () {
    wbKeys = { u: false, d: false, l: false, r: false };
    if (wbState && wbState.on) wbPush(true);
  });

  document.getElementById('wbStart').addEventListener('click', function () {
    if (wbState && wbState.on && wbState.phase !== 'done' &&
        !confirm('진행 중인 물풍선 판이 있습니다. 새로 시작할까요?')) return;
    send({
      t: 'wb', act: 'start',
      bombs: Number(document.getElementById('wbBombs').value),
      power: Number(document.getElementById('wbPower').value),
    });
  });
  document.getElementById('wbEnd').addEventListener('click', function () {
    if (confirm('물풍선을 종료할까요?')) send({ t: 'wb', act: 'end' });
  });

  // ── 그리기 ──
  var WB_ITEM = ['💧', '🎈', '👟'];

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /** 바닥·벽·상자만 별도 캔버스에 그린다 (맵이 바뀔 때만 호출) */
  function wbDrawBase() {
    var g = wbBaseCtx, T = wbG.tile;
    g.fillStyle = '#0d1220';
    g.fillRect(0, 0, CW, CH);
    for (var ty = 0; ty < wbG.rows; ty++) {
      for (var tx = 0; tx < wbG.cols; tx++) {
        var X = wbLeft(tx), Y = wbTop(ty);
        var v = wbMap[wbIdxC(tx, ty)];
        if (v === 1) {
          g.fillStyle = '#3b4457';
          g.fillRect(X, Y, T, T);
          g.fillStyle = '#535e75';
          g.fillRect(X + 3, Y + 3, T - 6, T - 12);
          g.fillStyle = 'rgba(255,255,255,.10)';
          g.fillRect(X + 3, Y + 3, T - 6, 6);
        } else if (v === 2) {
          g.fillStyle = '#8a5a33';
          roundRect(g, X + 3, Y + 3, T - 6, T - 6, 8); g.fill();
          g.strokeStyle = 'rgba(0,0,0,.35)';
          g.lineWidth = 4;
          g.beginPath();
          g.moveTo(X + 8, Y + 8); g.lineTo(X + T - 8, Y + T - 8);
          g.moveTo(X + T - 8, Y + 8); g.lineTo(X + 8, Y + T - 8);
          g.stroke();
          g.fillStyle = 'rgba(255,255,255,.12)';
          g.fillRect(X + 6, Y + 6, T - 12, 5);
        } else {
          g.fillStyle = ((tx + ty) % 2) ? '#182236' : '#1c2740';
          g.fillRect(X, Y, T, T);
        }
      }
    }
  }

  function drawWb() {
    var s = wbState;
    wc.fillStyle = '#0d1220';
    wc.fillRect(0, 0, CW, CH);

    if (!s || !s.on || !wbMap || !wbG) {
      wc.fillStyle = 'rgba(255,255,255,.35)';
      wc.font = '700 34px system-ui, sans-serif';
      wc.textAlign = 'center';
      wc.fillText('게임 시작을 누르면 판이 열립니다', CW / 2, CH / 2);
      wc.textAlign = 'left';
      return;
    }

    var T = wbG.tile, now = Date.now();

    // 바닥·벽·상자는 상자가 부서질 때만 바뀐다. 바뀌었을 때만 다시 그려 두고 붙인다.
    if (wbBaseKey !== wbMapStr) { wbDrawBase(); wbBaseKey = wbMapStr; }
    wc.drawImage(wbBase, 0, 0);

    // 아이템
    wc.textAlign = 'center';
    wc.textBaseline = 'middle';
    s.items.forEach(function (it) {
      var X = wbLeft(it[0]), Y = wbTop(it[1]);
      var bob = Math.sin(now / 260 + it[0] + it[1]) * 3;
      wc.fillStyle = 'rgba(255,255,255,.90)';
      roundRect(wc, X + 10, Y + 10 + bob, T - 20, T - 20, 10); wc.fill();
      wc.font = '30px system-ui, sans-serif';
      wc.fillText(WB_ITEM[it[2]] || '?', X + T / 2, Y + T / 2 + bob + 1);
    });

    // 물줄기 — 물풍선이 터진 자리
    s.water.forEach(function (w) {
      var X = wbLeft(w[0]), Y = wbTop(w[1]);
      var pulse = 0.55 + 0.25 * Math.sin(now / 90 + w[0] + w[1]);
      wc.fillStyle = 'rgba(56,189,248,' + pulse.toFixed(2) + ')';
      if (w[2] === 0) { roundRect(wc, X + 2, Y + 2, T - 4, T - 4, 14); wc.fill(); }
      else if (w[2] === 1) { roundRect(wc, X, Y + 12, T, T - 24, 10); wc.fill(); }
      else { roundRect(wc, X + 12, Y, T - 24, T, 10); wc.fill(); }
      wc.fillStyle = 'rgba(224,247,255,.75)';
      wc.beginPath();
      wc.arc(X + T / 2, Y + T / 2, 9 + 3 * Math.sin(now / 70 + w[0]), 0, Math.PI * 2);
      wc.fill();
    });

    // 물풍선 — 터질 때가 가까울수록 크게 부푼다
    s.balloons.forEach(function (b) {
      var cx = wbCXc(b[0]), cy = wbCYc(b[1]);
      var ratio = 1 - Math.max(0, Math.min(1, b[2] / wbMeta.fuse));
      var r = T * 0.30 + ratio * 6 + Math.sin(now / (70 - ratio * 45)) * (2 + ratio * 4);
      wc.fillStyle = 'rgba(0,0,0,.35)';
      wc.beginPath(); wc.ellipse(cx, cy + r * 0.8, r * 0.85, r * 0.3, 0, 0, Math.PI * 2); wc.fill();
      // 그라디언트 비용을 재 보니 원 겹치기와 차이가 없었다 (0.024 vs 0.025 ms/프레임).
      // 더 예쁜 쪽을 쓴다.
      var grd = wc.createRadialGradient(cx - r * 0.3, cy - r * 0.4, r * 0.15, cx, cy, r);
      grd.addColorStop(0, '#bff0ff');
      grd.addColorStop(0.55, '#38bdf8');
      grd.addColorStop(1, '#0b6fa4');
      wc.fillStyle = grd;
      wc.beginPath(); wc.arc(cx, cy, r, 0, Math.PI * 2); wc.fill();
      wc.fillStyle = 'rgba(255,255,255,.85)';
      wc.beginPath(); wc.arc(cx - r * 0.32, cy - r * 0.36, r * 0.20, 0, Math.PI * 2); wc.fill();
    });

    // 캐릭터
    s.players.forEach(function (pl) {
      var who = wbWho[pl.i] || { n: '?', c: '#888888' };
      var px, py;
      if (pl.i === me.id && wbMine) { px = wbMine.x; py = wbMine.y; }
      else { var at = wbAt(pl.i, pl.x, pl.y); px = at.x; py = at.y; }

      if (!pl.a) {   // 탈락 — 자리만 흐리게 남긴다
        wc.globalAlpha = 0.22;
        wc.fillStyle = who.c;
        wc.beginPath(); wc.arc(px, py, T * 0.26, 0, Math.PI * 2); wc.fill();
        wc.globalAlpha = 1;
        return;
      }

      var r = T * 0.30;
      wc.fillStyle = 'rgba(0,0,0,.32)';
      wc.beginPath(); wc.ellipse(px, py + r * 0.9, r * 0.8, r * 0.28, 0, 0, Math.PI * 2); wc.fill();

      wc.globalAlpha = pl.sf && !pl.t ? (Math.sin(now / 90) > 0 ? 0.45 : 1) : 1;   // 무적이면 깜빡
      wc.fillStyle = who.c;
      wc.beginPath(); wc.arc(px, py, r, 0, Math.PI * 2); wc.fill();
      wc.strokeStyle = 'rgba(0,0,0,.45)'; wc.lineWidth = 3; wc.stroke();

      // 눈 — 바라보는 쪽으로
      var ex = pl.d === 'l' ? -r * 0.28 : pl.d === 'r' ? r * 0.28 : 0;
      var ey = pl.d === 'u' ? -r * 0.30 : r * 0.10;
      wc.fillStyle = '#fff';
      wc.beginPath(); wc.arc(px + ex - r * 0.24, py + ey, r * 0.20, 0, Math.PI * 2); wc.fill();
      wc.beginPath(); wc.arc(px + ex + r * 0.24, py + ey, r * 0.20, 0, Math.PI * 2); wc.fill();
      wc.fillStyle = '#111';
      wc.beginPath(); wc.arc(px + ex * 1.4 - r * 0.24, py + ey, r * 0.09, 0, Math.PI * 2); wc.fill();
      wc.beginPath(); wc.arc(px + ex * 1.4 + r * 0.24, py + ey, r * 0.09, 0, Math.PI * 2); wc.fill();
      wc.globalAlpha = 1;

      // 물방울에 갇힘
      if (pl.t) {
        var br = r * 1.55 + Math.sin(now / 200 + pl.i) * 2;
        wc.fillStyle = 'rgba(125,211,252,.28)';
        wc.beginPath(); wc.arc(px, py, br, 0, Math.PI * 2); wc.fill();
        wc.strokeStyle = 'rgba(186,230,253,.9)'; wc.lineWidth = 3;
        wc.beginPath(); wc.arc(px, py, br, 0, Math.PI * 2); wc.stroke();
        wc.fillStyle = 'rgba(255,255,255,.6)';
        wc.beginPath(); wc.arc(px - br * 0.35, py - br * 0.4, br * 0.16, 0, Math.PI * 2); wc.fill();
        // 남은 시간 고리
        var left = Math.max(0, pl.tl) / wbMeta.trapMs;
        wc.strokeStyle = left < 0.34 ? '#f87171' : '#e0f2fe';
        wc.lineWidth = 5;
        wc.beginPath();
        wc.arc(px, py, br + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left);
        wc.stroke();
        wc.fillStyle = '#fff';
        wc.font = '700 20px system-ui, sans-serif';
        wc.fillText(Math.ceil(pl.tl / 1000) + '', px, py - br - 16);
      }

      // 이름
      wc.font = '700 15px system-ui, sans-serif';
      wc.fillStyle = 'rgba(0,0,0,.55)';
      var nw = wc.measureText(who.n).width + 12;
      roundRect(wc, px - nw / 2, py - r - 30, nw, 20, 9); wc.fill();
      wc.fillStyle = pl.i === me.id ? '#fde68a' : '#fff';
      wc.fillText(who.n, px, py - r - 20);
    });

    wc.textAlign = 'left';
    wc.textBaseline = 'alphabetic';
  }

  function wbFrame(ts) {
    requestAnimationFrame(wbFrame);
    if (mode !== 'wb') { wbLast = ts; return; }
    var dt = Math.min(0.05, (ts - wbLast) / 1000 || 0);
    wbLast = ts;
    wbPredict(dt);
    drawWb();
  }
  requestAnimationFrame(wbFrame);

  function renderWbHud() {
    var s = wbState;
    wbStandEl.innerHTML = '';

    if (!s || !s.on) {
      wbStatusEl.textContent = '물풍선이 시작되지 않았습니다';
      wbBig.style.display = 'none';
      return;
    }

    if (s.phase === 'countdown') {
      wbBig.style.display = '';
      wbBig.innerHTML = '';
      wbBig.appendChild(document.createTextNode(String(Math.ceil(s.countdown / 1000))));
      var sm = document.createElement('small');
      sm.textContent = '방향키로 이동 · 스페이스바로 물풍선';
      wbBig.appendChild(sm);
      wbStatusEl.textContent = '곧 시작합니다';
    } else if (s.phase === 'done') {
      wbBig.style.display = '';
      wbBig.innerHTML = '';
      wbBig.appendChild(document.createTextNode(s.winner ? '🏆' : '🤝'));
      var sm2 = document.createElement('small');
      var win = null;
      (s.results || []).forEach(function (r) { if (r.id === s.winner) win = r; });
      sm2.textContent = win ? win.name + ' 님 우승!' : '무승부';
      wbBig.appendChild(sm2);
      wbStatusEl.textContent = '끝났습니다 — 다시 시작하려면 게임 시작';
    } else {
      wbBig.style.display = 'none';
      var alive = 0;
      s.players.forEach(function (p) { if (p.a) alive++; });
      wbStatusEl.innerHTML = '';
      var hl = document.createElement('span');
      hl.className = 'hl';
      hl.textContent = alive + '명 생존';
      wbStatusEl.appendChild(hl);
      wbStatusEl.appendChild(document.createTextNode(' · 남은 시간 ' + Math.ceil(s.left / 1000) + '초'));
    }

    var list = s.players.slice();
    if (s.phase === 'done' && s.results) {
      var rank = {};
      s.results.forEach(function (r) { rank[r.id] = r.rank; });
      list.sort(function (a, b) { return (rank[a.i] || 99) - (rank[b.i] || 99); });
    }
    list.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'r' + (p.i === me.id ? ' me' : '') + (p.a ? '' : ' fin');
      var who2 = wbWho[p.i] || { n: '?', c: '#888888' };
      var dot = document.createElement('i');
      dot.style.background = who2.c;
      el.appendChild(dot);
      el.appendChild(document.createTextNode(who2.n + (p.i === me.id ? '(나)' : '') + ' '));
      var em = document.createElement('em');
      em.textContent = !p.a ? '탈락 · 가둠 ' + p.k
        : p.t ? '🫧 갇힘 ' + Math.ceil(p.tl / 1000) + '초'
        : '🎈' + p.bm + ' 💧' + p.pw + ' 👟' + p.sp + ' · 가둠 ' + p.k;
      el.appendChild(em);
      wbStandEl.appendChild(el);
    });
  }

  // ── 이름 ────────────────────────────────────────
  var nameInput = document.getElementById('nameInput');
  var savedName = '';
  try { savedName = localStorage.getItem('paint-name') || ''; } catch (e) {}
  if (savedName) nameInput.value = savedName;

  var nameTimer = null;
  nameInput.addEventListener('input', function () {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(function () {
      var v = nameInput.value.trim();
      if (!v) return;
      try { localStorage.setItem('paint-name', v); } catch (e) {}
      send({ t: 'hello', name: v });
    }, 400);
  });

  // ── 연결 ────────────────────────────────────────
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');

  function setStatus(state, text) {
    dot.className = 'dot' + (state ? ' ' + state : '');
    statusText.textContent = text;
  }

  function send(obj) {
    if (ws && connected) ws.send(JSON.stringify(obj));
  }

  var peerMap = {};

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host);

    ws.onopen = function () {
      connected = true;
      setStatus('on', '연결됨');
    };

    ws.onclose = function () {
      connected = false;
      setStatus('off', '연결 끊김 — 다시 연결 중…');
      Object.keys(cursors).forEach(removeCursor);
      setTimeout(connect, 1500);
    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };

    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      switch (m.t) {
        case 'init':
          me.id = m.id;
          me.color = m.color;
          gridOn = !!m.grid;
          gridBtn.classList.toggle('active', gridOn);
          if (m.raceTracks) {
            var sel = document.getElementById('raceTrack');
            sel.innerHTML = '<option value="-1">트랙 랜덤</option>';
            m.raceTracks.forEach(function (tr) {
              var o = document.createElement('option');
              o.value = tr.i;
              o.textContent = tr.name;
              sel.appendChild(o);
            });
          }
          if (!nameInput.value) nameInput.value = m.name;
          ops = m.history.slice();
          redraw();
          log.innerHTML = '';
          m.chat.forEach(addChat);
          log.scrollTop = log.scrollHeight;
          m.peers.forEach(function (p) { peerMap[p.id] = p; });
          renderPeers(m.peers);
          // 저장해 둔 이름이 있으면 바로 알린다
          var v = nameInput.value.trim();
          if (v && v !== m.name) send({ t: 'hello', name: v });
          break;

        case 'seg':
          ops.push(m);
          drawSeg(m);
          break;

        case 'undo':
          ops = ops.filter(function (o) { return !(o.by === m.by && o.sid === m.sid); });
          redraw();
          break;

        case 'grid':
          gridOn = m.on;
          gridBtn.classList.toggle('active', gridOn);
          renderGrid();
          addSys(m.by + ' 님이 칸 나누기를 ' + (gridOn ? '켰습니다' : '껐습니다'));
          break;

        case 'cursor':
          moveCursor(m.id, m.x, m.y, peerMap[m.id]);
          break;

        case 'peers':
          peerMap = {};
          m.peers.forEach(function (p) { peerMap[p.id] = p; });
          renderPeers(m.peers);
          break;

        case 'leave':
          removeCursor(m.id);
          break;

        case 'clearCell':
          ops = ops.filter(function (o) { return !segInCellC(o, m.cell); });
          redraw();
          addSys(m.by + ' 님이 자기 칸을 지웠습니다');
          break;

        case 'clear':
          ops = [];
          clearCanvas();
          addSys(m.by + ' 님이 캔버스를 전체 지웠습니다');
          break;

        case 'chat':
          addChat(m.msg);
          break;

        case 'sys':
          addSys(m.text);
          break;

        case 'bingo':
          var wasOn = !!(bingoState && bingoState.on);
          bingoState = m;
          bingoDeadline = m.turnLeft ? Date.now() + m.turnLeft : 0;
          renderBingo();
          // 남이 게임을 시작하면 자동으로 빙고 화면으로 넘어간다
          if (!wasOn && m.on) setMode('bingo');
          break;

        case 'liar':
          var liarWasOn = !!(liarState && liarState.on);
          liarState = m;
          renderLiar();
          if (!liarWasOn && m.on) setMode('liar');
          break;

        case 'arch':
          var archWasOn = !!(archState && archState.on);
          archState = m;
          archRecvAt = Date.now();
          archDeadline = m.turnLeft ? Date.now() + m.turnLeft : 0;
          if (m.on && m.shot && m.shot.id !== lastShotId) {
            lastShotId = m.shot.id;
            flight = { pts: m.shot.pts, i: 0, color: m.shot.color, score: m.shot.score };
          }
          if (!m.on) { flight = null; lastShotId = 0; }
          renderArch();
          if (!archWasOn && m.on) { setMode('arch'); fitArch(); }
          break;

        case 'wb':
          var wbWasOn = !!(wbState && wbState.on);
          var wbPrev = wbState ? wbState.phase : null;
          wbState = m;
          wbSync(m);
          if (m.on && m.phase !== wbPrev && m.phase === 'play') wbPush(true);
          if (m.phase !== wbPrev || Date.now() - wbHud > 200) {
            wbHud = Date.now();
            renderWbHud();
          }
          if (!wbWasOn && m.on) { setMode('wb'); fitWb(); }
          break;

        case 'race':
          var raceWasOn = !!(raceState && raceState.on);
          var prevPhase = raceState ? raceState.phase : null;
          raceState = m;
          syncMyCar(m);
          // 새 레이스가 시작되면 서버 쪽 입력이 비워진다. 이미 키를 누르고 있던 사람은
          // 키 상태가 그대로라 아무것도 안 보내게 되므로, 여기서 한 번 다시 알려 준다.
          if (m.on && m.phase !== prevPhase && (m.phase === 'countdown' || m.phase === 'racing')) {
            pushInput(true);
          }
          // 화면(순위표)은 초당 5번만 갱신 — 캔버스는 별도로 매 프레임 그린다
          if (m.phase !== prevPhase || Date.now() - lastHud > 200) {
            lastHud = Date.now();
            renderRace();
          }
          if (!raceWasOn && m.on) { setMode('race'); fitTrack(); }
          break;
      }
    };
  }

  fit();
  setStatus('', '연결 중…');
  connect();
})();
</script>
</body>
</html>
