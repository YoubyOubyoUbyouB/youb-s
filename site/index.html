<title>생활·업무 영단어</title>
<style>
  :root{
    --ground:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EDEB; --line:#D3DCD9;
    --ink:#14201E; --ink-2:#4A5A56; --ink-3:#7C8C88;
    --accent:#0E7C6B; --accent-soft:#D9EBE7; --gold:#B57C0A; --gold-soft:#F6EAD0;
    --ok:#2F7D46; --ok-soft:#DCEDE1; --no:#AB4038; --no-soft:#F5DFDD;
    --shadow:0 1px 2px rgba(20,32,30,.06),0 8px 24px rgba(20,32,30,.06);
    --r:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E1918; --surface:#162422; --surface-2:#1E302D; --line:#2C3F3B;
      --ink:#E7EFEC; --ink-2:#A8BAB5; --ink-3:#7B8D89;
      --accent:#3BB9A1; --accent-soft:#17332E; --gold:#D9A63F; --gold-soft:#332A16;
      --ok:#5BB877; --ok-soft:#16301F; --no:#D8756B; --no-soft:#33201E;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1918; --surface:#162422; --surface-2:#1E302D; --line:#2C3F3B;
    --ink:#E7EFEC; --ink-2:#A8BAB5; --ink-3:#7B8D89;
    --accent:#3BB9A1; --accent-soft:#17332E; --gold:#D9A63F; --gold-soft:#332A16;
    --ok:#5BB877; --ok-soft:#16301F; --no:#D8756B; --no-soft:#33201E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .en{font-family:Georgia,"Times New Roman",serif}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 92px;min-height:100vh}

  header{padding:20px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:700}
  .sub{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  @media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

  .row{display:flex;gap:8px;align-items:center}
  .between{justify-content:space-between}
  select,.btn,.chip{font-family:inherit;font-size:14px;color:var(--ink)}
  select{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;appearance:none;min-width:0;
  }
  .btn{
    border:1px solid var(--line);background:var(--surface);border-radius:12px;
    padding:12px 14px;cursor:pointer;font-weight:600;box-shadow:var(--shadow);
  }
  .btn:active{transform:translateY(1px)}
  .btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .btn.no{background:var(--no-soft);border-color:transparent;color:var(--no)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.ghost{box-shadow:none;background:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);
  }

  /* 단어 카드 */
  .flash{
    margin-top:14px;padding:34px 20px 26px;min-height:250px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;position:relative;
  }
  .idx{position:absolute;top:12px;left:14px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .star{background:none;border:0;font-size:20px;cursor:pointer;line-height:1;padding:6px;color:var(--ink-3)}
  .star.on{color:var(--gold)}
  .star.abs{position:absolute;top:8px;right:8px}
  .wordline{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
  .word{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
  .speak{
    border:1px solid var(--line);background:var(--surface);color:var(--accent);
    width:38px;height:38px;border-radius:99px;cursor:pointer;font-size:17px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;flex:none;
  }
  .speak:active{background:var(--accent-soft)}
  .speak.sm{width:30px;height:30px;font-size:14px}
  .pos{font-size:11px;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);
       padding:3px 9px;border-radius:99px;font-weight:700}
  .mean{font-size:22px;font-weight:700;line-height:1.4}
  .divider{width:36px;height:1px;background:var(--line);margin:2px 0}
  .ex{font-size:14px;color:var(--ink-2);line-height:1.6;max-width:38ch}
  .exk{font-size:13px;color:var(--ink-3);line-height:1.6;max-width:38ch}
  .hidden{display:none !important}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

  /* 퀴즈 */
  .opt{
    display:block;width:100%;text-align:left;margin-top:8px;padding:14px;
    border:1px solid var(--line);background:var(--surface);border-radius:12px;
    font-size:15px;font-family:inherit;color:var(--ink);cursor:pointer;font-weight:600;
  }
  .opt.right{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .opt.wrong{background:var(--no-soft);border-color:transparent;color:var(--no)}
  .opt:disabled{cursor:default}

  /* 목록 */
  input[type=search]{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;
  }
  .item{display:flex;gap:9px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .w{font-size:16px;font-weight:700;min-width:30%}
  .item .m{font-size:13px;color:var(--ink-2);flex:1;min-width:0}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--line);flex:none;align-self:center}
  .dot.k{background:var(--ok)} .dot.u{background:var(--no)}
  .list{margin-top:10px;max-height:none;overflow:hidden}

  /* 진도 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{padding:14px 10px;text-align:center}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{font-size:11px;color:var(--ink-3)}
  .note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:14px}

  /* 탭바 */
  nav{
    position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)
  }
  nav button{
    flex:1;border:0;background:none;padding:11px 4px 13px;font-family:inherit;
    font-size:11px;color:var(--ink-3);cursor:pointer;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px
  }
  nav button.on{color:var(--accent)}
  nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  h2{font-size:14px;margin:20px 0 0;color:var(--ink-2)}
</style>

<div class="wrap">
  <header>
    <h1>생활·업무 영단어</h1>
    <div class="sub" id="hcount"></div>
  </header>
  <div class="bar"><i id="hbar" style="width:0%"></i></div>

  <!-- 학습 -->
  <section id="v-study">
    <div class="row between" style="margin-top:14px">
      <select id="range" aria-label="학습 카테고리"></select>
      <select id="filter" aria-label="학습 대상">
        <option value="all">전체 단어</option>
        <option value="new">아직 안 본 것</option>
        <option value="unknown">모르는 단어만</option>
        <option value="fav">즐겨찾기만</option>
      </select>
    </div>

    <div class="card flash" id="card">
      <div class="idx" id="cidx"></div>
      <button class="star abs" id="cstar" aria-label="즐겨찾기에 추가">☆</button>
      <div class="pos" id="cpos"></div>
      <div class="wordline">
        <span class="word en" id="cword">준비 중</span>
        <button class="speak" id="cspeak" aria-label="발음 듣기">🔊</button>
      </div>
      <div class="mean" id="cmean"></div>
      <div class="divider"></div>
      <div class="ex en" id="cex"></div>
      <div class="exk" id="cexk"></div>
    </div>

    <div class="grid2">
      <button class="btn no" id="bno">모르겠어요</button>
      <button class="btn ok" id="bok">알아요</button>
    </div>
    <div class="row" style="margin-top:8px;gap:8px">
      <button class="btn ghost" id="bprev" style="flex:1">← 이전</button>
      <button class="btn ghost" id="bfav" style="flex:1.2">☆ 즐겨찾기</button>
      <button class="btn ghost" id="bskip" style="flex:1">다음 →</button>
    </div>
  </section>

  <!-- 퀴즈 -->
  <section id="v-quiz" class="hidden">
    <div class="row between" style="margin-top:14px">
      <select id="qrange" aria-label="퀴즈 카테고리"></select>
      <div class="sub" id="qscore">0 / 0</div>
    </div>
    <div class="card" style="margin-top:12px;padding:26px 18px;text-align:center">
      <div class="pos" id="qpos" style="display:inline-block"></div>
      <div class="wordline" style="margin-top:10px">
        <span class="word en" id="qword">시작하기</span>
        <button class="speak" id="qspeak" aria-label="발음 듣기">🔊</button>
      </div>
      <div style="font-size:12px;color:var(--ink-3);margin-top:10px">알맞은 뜻을 고르세요</div>
    </div>
    <div id="qopts"></div>
    <button class="btn primary" id="qnext" style="width:100%;margin-top:12px">다음 문제</button>
  </section>

  <!-- 목록 -->
  <section id="v-list" class="hidden">
    <div style="margin-top:14px"><input type="search" id="q" placeholder="단어 또는 뜻 검색"></div>
    <div class="row between" style="margin-top:8px">
      <select id="lrange" aria-label="목록 카테고리"></select>
      <div class="sub" id="lcount"></div>
    </div>
    <div class="card list" id="listbox"></div>
  </section>

  <!-- 진도 -->
  <section id="v-stat" class="hidden">
    <div class="stats">
      <div class="card stat"><b id="s1">0</b><span>아는 단어</span></div>
      <div class="card stat"><b id="s2">0</b><span>모르는 단어</span></div>
      <div class="card stat"><b id="s3">0</b><span>즐겨찾기</span></div>
    </div>
    <h2>카테고리별 진행률</h2>
    <div class="card" id="blocks" style="margin-top:10px;padding:6px 12px"></div>
    <h2>데이터</h2>
    <div class="card" style="margin-top:10px;padding:14px">
      <div class="note" style="margin:0">학습 기록은 이 기기의 브라우저에 저장됩니다. 다른 기기와는 공유되지 않아요.</div>
      <button class="btn" id="reset" style="width:100%;margin-top:12px">학습 기록 초기화</button>
    </div>
    <div class="note">
      현재 <b id="total2">0</b>개 수록 · 목표 8,000개<br>
      관사·전치사 같은 기능어는 외울 필요가 적어 제외하고, 실제 쓰임이 많은 단어와 여행·업무 실무 어휘 위주로 담았습니다.
    </div>
  </section>
</div>

<nav>
  <button data-v="study" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>학습</button>
  <button data-v="quiz"><svg viewBox="0 0 24 24"><path d="M9 9a3 3 0 116 0c0 2-3 2.5-3 4"/><circle cx="12" cy="18" r=".6"/></svg>퀴즈</button>
  <button data-v="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>목록</button>
  <button data-v="stat"><svg viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>진도</button>
</nav>

const KEY="wb_state_v1";
let S={known:{},unknown:{},fav:{},pos:0,quiz:{c:0,t:0}};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

const $=id=>document.getElementById(id);
/* 카테고리 */
const CAT_ORDER=["문법","회화 표현","기본 어휘","일반 동사","일반 명사","형용사·부사",
  "시간·날짜","사람·감정","자연·날씨","일상생활","식음료","쇼핑","건강·응급",
  "교통·길찾기","항공·공항","호텔·숙박","관광·액티비티","예약·요금","결제·정산","업무·이메일"];
const CAT_COUNT={};
W.forEach(r=>{const c=r[5]||"기타"; CAT_COUNT[c]=(CAT_COUNT[c]||0)+1;});
const CATS=CAT_ORDER.filter(c=>CAT_COUNT[c]).concat(Object.keys(CAT_COUNT).filter(c=>!CAT_ORDER.includes(c)).sort());

/* 큰 분류: 단어 / 회화 / 문법 */
const grpOf=c=> c==="문법" ? "문법" : (c==="회화 표현" ? "회화" : "단어");
const GRP_COUNT={};
W.forEach(r=>{const g=grpOf(r[5]); GRP_COUNT[g]=(GRP_COUNT[g]||0)+1;});
const GRPS=["단어","회화","문법"].filter(g=>GRP_COUNT[g]);

function fillCats(sel){
  let h='<option value="">전체 '+W.length+'개</option>';
  h+='<optgroup label="큰 분류">';
  GRPS.forEach(g=>{h+='<option value="G:'+g+'">'+g+' ('+GRP_COUNT[g]+')</option>';});
  h+='</optgroup><optgroup label="세부 주제">';
  CATS.filter(c=>grpOf(c)==="단어").forEach(c=>{h+='<option value="C:'+c+'">'+c+' ('+CAT_COUNT[c]+')</option>';});
  h+='</optgroup>';
  sel.innerHTML=h;
}
["range","qrange","lrange"].forEach(id=>fillCats($(id)));
/* 선택값이 항목에 맞는지 */
function inSel(i,v){
  if(!v) return true;
  if(v.startsWith("G:")) return grpOf(W[i][5])===v.slice(2);
  if(v.startsWith("C:")) return W[i][5]===v.slice(2);
  return W[i][5]===v;
}

function pool(){
  const c=$("range").value, f=$("filter").value;
  let idx=[];
  for(let i=0;i<W.length;i++){
    if(!inSel(i,c)) continue;
    if(f==="new" && (S.known[i]||S.unknown[i])) continue;
    if(f==="unknown" && !S.unknown[i]) continue;
    if(f==="fav" && !S.fav[i]) continue;
    idx.push(i);
  }
  return idx;
}
let P=[], p=0;

function refreshHead(){
  const k=Object.keys(S.known).length;
  $("hcount").textContent=k+" / "+W.length+" 단어";
  $("hbar").style.width=(W.length?k/W.length*100:0)+"%";
}
/* 발음 듣기 (브라우저 내장 음성) */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices()||[];
  VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(text){
  if(!window.speechSynthesis){alert("이 브라우저는 발음 듣기를 지원하지 않습니다.");return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-US"; u.rate=.9; if(VOICE) u.voice=VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}

function renderCard(){
  P=pool();
  if(!P.length){
    $("cword").textContent="해당 단어 없음";
    $("cpos").textContent=""; $("cidx").textContent="";
    $("cmean").textContent="조건을 바꿔보세요";
    $("cex").textContent=""; $("cexk").textContent="";
    return;
  }
  if(p>=P.length) p=0; if(p<0) p=P.length-1;
  const i=P[p], w=W[i];
  $("cidx").textContent=(i+1)+"번 · "+(p+1)+"/"+P.length;
  $("cword").textContent=w[0];
  $("cpos").textContent=w[1]+(w[5]?" · "+w[5]:"");
  $("cmean").textContent=w[2];
  $("cex").textContent=w[3];
  $("cexk").textContent=w[4];
  const on=!!S.fav[i];
  $("cstar").textContent=on?"★":"☆";
  $("cstar").classList.toggle("on",on);
  $("bfav").textContent=on?"★ 즐겨찾기 해제":"☆ 즐겨찾기";
  refreshHead();
}
function toggleFav(){
  const i=P[p]; if(i===undefined) return;
  if(S.fav[i]) delete S.fav[i]; else S.fav[i]=1;
  save(); renderCard();
}
$("cstar").addEventListener("click",toggleFav);
$("bfav").addEventListener("click",toggleFav);
$("cspeak").addEventListener("click",()=>{const i=P[p]; if(i!==undefined) speak(W[i][0]);});
$("qspeak").addEventListener("click",()=>{if(qi>=0) speak(W[qi][0]);});
function mark(good){
  const i=P[p]; if(i===undefined) return;
  if(good){S.known[i]=1; delete S.unknown[i];}
  else {S.unknown[i]=1; delete S.known[i];}
  save(); p++; renderCard();
}
$("bok").onclick=()=>mark(true);
$("bno").onclick=()=>mark(false);
$("bprev").onclick=()=>{p--;renderCard();};
$("bskip").onclick=()=>{p++;renderCard();};
$("range").onchange=()=>{p=0;renderCard();};
$("filter").onchange=()=>{p=0;renderCard();};

/* 퀴즈 */
let qi=-1, qdone=false;
function qpool(){
  const c=$("qrange").value; const a=[];
  for(let i=0;i<W.length;i++){ if(!inSel(i,c)) continue; a.push(i); }
  return a;
}
function newQuiz(){
  const a=qpool(); if(a.length<4){$("qword").textContent="단어 부족";$("qopts").innerHTML="";return;}
  qi=a[Math.floor(Math.random()*a.length)]; qdone=false;
  $("qword").textContent=W[qi][0];
  $("qpos").textContent=W[qi][1];
  const opts=[qi];
  while(opts.length<4){ const r=a[Math.floor(Math.random()*a.length)]; if(!opts.includes(r)) opts.push(r); }
  opts.sort(()=>Math.random()-.5);
  $("qopts").innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt"; b.textContent=W[o][2]; b.dataset.i=o;
    b.onclick=()=>{
      if(qdone) return; qdone=true;
      S.quiz.t++; if(o===qi){S.quiz.c++; S.known[qi]=1;} else {S.unknown[qi]=1;}
      save();
      [...$("qopts").children].forEach(x=>{
        x.disabled=true;
        if(+x.dataset.i===qi) x.classList.add("right");
      });
      if(o!==qi) b.classList.add("wrong");
      $("qscore").textContent=S.quiz.c+" / "+S.quiz.t;
      refreshHead();
    };
    $("qopts").appendChild(b);
  });
  $("qscore").textContent=S.quiz.c+" / "+S.quiz.t;
}
$("qnext").onclick=newQuiz;
$("qrange").onchange=newQuiz;

/* 목록 */
function renderList(){
  const c=$("lrange").value, q=$("q").value.trim().toLowerCase();
  let h="",n=0;
  for(let i=0;i<W.length;i++){
    if(!inSel(i,c)) continue;
    const w=W[i];
    if(q && !(w[0].toLowerCase().includes(q)||w[2].includes(q))) continue;
    n++;
    const cls=S.known[i]?"k":(S.unknown[i]?"u":"");
    const on=S.fav[i]?" on":"";
    h+='<div class="item"><span class="dot '+cls+'"></span>'
      +'<span class="w en">'+w[0]+'</span><span class="m">'+w[2]+'</span>'
      +'<button class="speak sm" data-say="'+i+'" aria-label="발음 듣기">🔊</button>'
      +'<button class="star'+on+'" data-fav="'+i+'" aria-label="즐겨찾기">'+(S.fav[i]?"★":"☆")+'</button></div>';
  }
  $("listbox").innerHTML=h||'<div class="item"><span class="m">검색 결과가 없습니다</span></div>';
  $("lcount").textContent=n+"개";
}
$("listbox").addEventListener("click",e=>{
  const say=e.target.closest("[data-say]"), fav=e.target.closest("[data-fav]");
  if(say){ speak(W[+say.dataset.say][0]); return; }
  if(fav){
    const i=+fav.dataset.fav;
    if(S.fav[i]) delete S.fav[i]; else S.fav[i]=1;
    save(); renderList();
  }
});
$("q").oninput=renderList; $("lrange").onchange=renderList;

/* 진도 */
function renderStat(){
  $("s1").textContent=Object.keys(S.known).length;
  $("s2").textContent=Object.keys(S.unknown).length;
  $("s3").textContent=Object.keys(S.fav).length;
  $("total2").textContent=W.length;
  const tot={}, kno={}, gt={}, gk={};
  W.forEach((r,i)=>{
    const c=r[5]||"기타", g=grpOf(c);
    tot[c]=(tot[c]||0)+1; gt[g]=(gt[g]||0)+1;
    if(S.known[i]){ kno[c]=(kno[c]||0)+1; gk[g]=(gk[g]||0)+1; }
  });
  let h="";
  GRPS.forEach(g=>{
    const t=gt[g]||0,k=gk[g]||0,pc=t?Math.round(k/t*100):0;
    h+='<div style="padding:10px 0;border-bottom:1px solid var(--line)">'
      +'<div class="row between" style="font-size:13px;font-weight:700"><span>'+g+'</span>'
      +'<span style="font-variant-numeric:tabular-nums">'+k+'/'+t+' · '+pc+'%</span></div>'
      +'<div class="bar" style="margin-top:6px"><i style="width:'+pc+'%"></i></div></div>';
  });
  h+='<div style="font-size:11px;color:var(--ink-3);padding:12px 0 4px">단어 세부 주제</div>';
  CATS.filter(c=>grpOf(c)==="단어").forEach(c=>{
    const t=tot[c]||0, k=kno[c]||0, pc=t?Math.round(k/t*100):0;
    h+='<div style="padding:9px 0;border-bottom:1px solid var(--line)">'
      +'<div class="row between" style="font-size:12px;color:var(--ink-2)"><span>'+c+'</span>'
      +'<span style="font-variant-numeric:tabular-nums">'+k+'/'+t+' · '+pc+'%</span></div>'
      +'<div class="bar" style="margin-top:6px"><i style="width:'+pc+'%"></i></div></div>';
  });
  $("blocks").innerHTML=h;
}
$("reset").onclick=()=>{
  if(!confirm("학습 기록을 모두 지웁니다. 계속할까요?")) return;
  S={known:{},unknown:{},fav:{},pos:0,quiz:{c:0,t:0}};
  save(); renderCard(); renderList(); renderStat(); refreshHead();
};

/* 탭 */
document.querySelectorAll("nav button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    const v=btn.dataset.v;
    ["study","quiz","list","stat"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
    if(v==="list") renderList();
    if(v==="stat") renderStat();
    if(v==="quiz" && qi<0) newQuiz();
  };
});

renderCard(); refreshHead();
</script>
