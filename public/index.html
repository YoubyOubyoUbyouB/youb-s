<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>공유 그림판</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #21252e;
    --line: #2e3440;
    --text: #e7eaf0;
    --muted: #949cad;
    --accent: #4f8cff;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* ── 상단 바 ───────────────────────────── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .dot.on { background: #22c55e; }
  .dot.off { background: #ef4444; }

  #nameInput {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 10px; font-size: 13px; width: 130px;
    font-family: inherit;
  }
  #nameInput:focus { outline: none; border-color: var(--accent); }

  .peers { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .peer {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12px;
  }
  .peer i { width: 9px; height: 9px; border-radius: 50%; display: block; }

  /* ── 도구 바 ───────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tool {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .tool:hover { border-color: #48505f; }
  .tool.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tool.danger:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

  .swatches { display: flex; gap: 5px; }
  .sw {
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .sw.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  #customColor {
    width: 30px; height: 24px; padding: 0; border: 1px solid var(--line);
    border-radius: 6px; background: none; cursor: pointer;
  }

  .sizer { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #width { width: 110px; accent-color: var(--accent); }
  #widthVal { width: 26px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }

  .sep { width: 1px; height: 22px; background: var(--line); }

  /* ── 본문 ─────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }

  .stage {
    flex: 1; min-width: 0; display: flex;
    align-items: center; justify-content: center;
    padding: 14px; background: #0b0d11;
  }

  /* ── 빙고 ─────────────────────────────── */
  .bingo { display: none; flex-direction: column; align-items: center; gap: 14px;
           width: 100%; height: 100%; overflow-y: auto; padding: 4px; }
  .bingo.on { display: flex; }

  .bingo-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .bingo-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #bingoStatus { font-size: 15px; font-weight: 700; text-align: center; min-height: 22px; }
  #bingoStatus .hl { color: var(--accent); }
  #bingoStatus .win { color: #fbbf24; }

  .board { display: grid; gap: 6px; }
  .board .num {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; font-size: 20px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1; cursor: default; transition: transform .08s;
  }
  .board .num.hit { background: var(--accent); border-color: var(--accent); color: #fff; }
  .board.myturn .num:not(.hit) { cursor: pointer; }
  .board.myturn .num:not(.hit):hover { border-color: var(--accent); transform: scale(1.05); }

  .scores { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .scores .s {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px 5px 9px;
  }
  .scores .s.turn { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .scores .s i { width: 9px; height: 9px; border-radius: 50%; }
  .scores .s em { font-style: normal; font-weight: 700; color: var(--accent); }

  .calledList { font-size: 12px; color: var(--muted); text-align: center; max-width: 460px; line-height: 1.7; }

  /* ── 라이어 게임 ──────────────────────── */
  .liar { display: none; flex-direction: column; align-items: center; gap: 16px;
          width: 100%; height: 100%; overflow-y: auto; padding: 4px; }
  .liar.on { display: flex; }
  .liar-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .liar-top select {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px 8px; font-size: 13px; font-family: inherit;
  }
  #liarPhase { font-size: 15px; font-weight: 700; text-align: center; }
  #liarPhase .hl { color: var(--accent); }

  /* 역할 카드 */
  .card {
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2);
    padding: 22px 34px; text-align: center; min-width: 260px;
  }
  .card .cap { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card .word { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .card.isliar { border-color: #b91c1c; background: rgba(185,28,28,.12); }
  .card.isliar .word { color: #f87171; }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

  .turns { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.8; max-width: 520px; }
  .turns b { color: var(--text); }

  .voteList { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .voteList button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 16px; font-size: 13px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
  }
  .voteList button:hover:not(:disabled) { border-color: var(--accent); }
  .voteList button.picked { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .voteList button:disabled { opacity: .5; cursor: default; }
  .voteList button i { width: 9px; height: 9px; border-radius: 50%; }
  .voteList button .done { font-size: 11px; color: #22c55e; }

  .guessBox { display: flex; gap: 8px; }
  .guessBox input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 10px 13px; font-size: 15px; font-family: inherit; width: 220px;
  }
  .guessBox input:focus { outline: none; border-color: var(--accent); }

  .resultBox { text-align: center; }
  .resultBox .big { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .resultBox .big.citizen { color: #4ade80; }
  .resultBox .big.liarwin { color: #f87171; }
  .resultBox .detail { font-size: 13px; color: var(--muted); line-height: 1.9; }
  .resultBox .detail b { color: var(--text); }
  .wrap {
    position: relative; background: #fff;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    touch-action: none;
  }
  #board { display: block; width: 100%; height: 100%; cursor: none; }

  /* 내 붓 크기를 보여주는 원 — 캔버스에 그려지는 게 아니라 위에 떠 있는 표시 */
  .brush {
    position: absolute; pointer-events: none; border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(0,0,0,.8);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.85);
    display: none;
  }
  .brush.on { display: block; }
  .brush.erase { border-style: dashed; }
  .brush::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%;
    background: rgba(0,0,0,.75); box-shadow: 0 0 0 1px rgba(255,255,255,.85);
  }

  /* 참여자별 칸 나누기 — 캔버스에 그려지는 게 아니라 위에 덮인 안내선 */
  .grid { position: absolute; inset: 0; pointer-events: none; display: none; }
  .grid.on { display: block; }
  .cell {
    position: absolute; border: 1px dashed rgba(0,0,0,.3);
    display: flex; align-items: flex-start; justify-content: flex-start;
  }
  .cell.mine { border: 2px solid; }
  .cell b {
    font-size: 11px; font-weight: 700; color: #fff; margin: 5px;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  .cursor {
    position: absolute; top: 0; left: 0; pointer-events: none;
    transform: translate(-7px, -7px); transition: left .06s linear, top .06s linear;
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .cursor b { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .cursor span {
    font-size: 11px; color: #fff; padding: 2px 7px; border-radius: 999px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  /* ── 채팅 ─────────────────────────────── */
  .chat {
    width: 300px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line);
  }
  .chat h2 {
    margin: 0; padding: 12px 14px; font-size: 13px; font-weight: 700;
    border-bottom: 1px solid var(--line); color: var(--muted);
  }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 11px; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #333a46; border-radius: 4px; }
  .line .who { font-size: 11px; font-weight: 700; margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
  .line .who time { color: #6d7686; font-weight: 400; font-size: 10px; }
  .line .body { font-size: 13px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
  .line.sys { color: var(--muted); font-size: 12px; text-align: center; }

  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  #chatInput {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit; resize: none;
    max-height: 90px; line-height: 1.4;
  }
  #chatInput:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    background: var(--accent); border: none; color: #fff; border-radius: 8px;
    padding: 0 15px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    .chat { width: auto; height: 240px; border-left: none; border-top: 1px solid var(--line); }
    .peers { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">🎨 공유 그림판</div>
  <button class="tool active" id="modePaint">그림판</button>
  <button class="tool" id="modeBingo">🎲 빙고</button>
  <button class="tool" id="modeLiar">🕵 라이어</button>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  <input id="nameInput" maxlength="20" placeholder="내 이름" autocomplete="off">
  <div class="peers" id="peers"></div>
</header>

<div class="toolbar">
  <button class="tool active" id="penBtn">✏️ 펜</button>
  <button class="tool" id="eraserBtn">🧽 지우개</button>
  <div class="sep"></div>
  <div class="swatches" id="swatches"></div>
  <input type="color" id="customColor" value="#111111" title="직접 색 고르기">
  <div class="sep"></div>
  <div class="sizer">
    굵기 <input type="range" id="width" min="1" max="60" value="4"><span id="widthVal">4</span>
  </div>
  <div class="sep"></div>
  <button class="tool" id="gridBtn" title="참여자 수에 맞춰 칸을 나누고, 각자 자기 칸에만 그립니다">⊞ 칸 나누기</button>
  <div class="sep"></div>
  <button class="tool" id="undoBtn" title="Ctrl+Z">↶ 실행취소</button>
  <button class="tool danger" id="clearBtn">전체 지우기</button>
</div>

<main>
  <div class="stage">
    <div class="wrap" id="wrap">
      <canvas id="board"></canvas>
      <div class="grid" id="grid"></div>
      <div class="brush" id="brush"></div>
    </div>

    <div class="bingo" id="bingo">
      <div id="bingoStatus">빙고가 시작되지 않았습니다</div>
      <div class="bingo-top">
        <select id="bingoSize">
          <option value="4">4 × 4</option>
          <option value="5" selected>5 × 5</option>
        </select>
        <select id="bingoGoal">
          <option value="1">1줄</option>
          <option value="2">2줄</option>
          <option value="3" selected>3줄</option>
          <option value="4">4줄</option>
          <option value="5">5줄</option>
        </select>
        <button class="tool" id="bingoStart">게임 시작</button>
        <button class="tool danger" id="bingoEnd">종료</button>
      </div>
      <div class="board" id="bingoBoard"></div>
      <div class="scores" id="bingoScores"></div>
      <div class="calledList" id="bingoCalled"></div>
    </div>

    <div class="liar" id="liar">
      <div id="liarPhase">라이어 게임이 시작되지 않았습니다</div>
      <div class="liar-top">
        <select id="liarCategory">
          <option value="">주제 랜덤</option>
          <option value="음식">음식</option>
          <option value="동물">동물</option>
          <option value="직업">직업</option>
          <option value="장소">장소</option>
          <option value="여행">여행</option>
          <option value="사물">사물</option>
          <option value="스포츠">스포츠</option>
        </select>
        <select id="liarMode">
          <option value="normal">일반 라이어</option>
          <option value="fool">🤪 바보 라이어</option>
        </select>
        <button class="tool" id="liarStart">게임 시작</button>
        <button class="tool" id="liarVoteBtn">투표 시작</button>
        <button class="tool danger" id="liarEnd">종료</button>
      </div>
      <div id="liarBody"></div>
    </div>
  </div>

  <aside class="chat">
    <h2>채팅</h2>
    <div id="log"></div>
    <div class="composer">
      <textarea id="chatInput" rows="1" placeholder="메시지 입력 (Enter 전송)" maxlength="500"></textarea>
      <button id="sendBtn">전송</button>
    </div>
  </aside>
</main>

<script>
(function () {
  'use strict';

  var CW = 1600, CH = 900;             // 캔버스 논리 크기 (서버와 동일)
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  canvas.width = CW;
  canvas.height = CH;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  var wrap = document.getElementById('wrap');
  var me = { id: null, color: '#111111' };
  var tool = 'pen';
  var color = '#111111';
  var width = 4;
  var ws = null, connected = false;

  // ── 캔버스 크기 맞추기 (비율 유지) ─────────────────
  function fit() {
    var stage = wrap.parentElement;
    var pad = 28;
    var aw = stage.clientWidth - pad;
    var ah = stage.clientHeight - pad;
    if (aw <= 0 || ah <= 0) return;   // 아직 화면에 안 그려진 상태(숨은 탭 등)
    var scale = Math.min(aw / CW, ah / CH);
    wrap.style.width = Math.max(160, Math.floor(CW * scale)) + 'px';
    wrap.style.height = Math.max(90, Math.floor(CH * scale)) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap.parentElement);

  // ── 그리기 ──────────────────────────────────────
  function drawSeg(s) {
    ctx.save();
    ctx.globalCompositeOperation = s.e ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.c;
    ctx.lineWidth = s.w;
    ctx.beginPath();
    ctx.moveTo(s.x0, s.y0);
    ctx.lineTo(s.x1, s.y1);
    ctx.stroke();
    ctx.restore();
  }

  function clearCanvas() {
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, CW, CH);
    ctx.restore();
  }

  // 지금까지 그려진 획 조각 전부. 실행취소 때 이걸로 다시 그린다.
  var ops = [];
  function redraw() {
    clearCanvas();
    for (var i = 0; i < ops.length; i++) drawSeg(ops[i]);
  }

  function toCanvas(ev) {
    var r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * CW,
      y: (ev.clientY - r.top) / r.height * CH
    };
  }

  var drawing = false, last = null, lastCursorSent = 0, strokeSeq = 0;

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    drawing = true;
    strokeSeq++;                 // 여기서부터 새 획 — 실행취소는 이 단위로 지운다
    last = clampToCell(toCanvas(ev));
    showBrush(ev);
    // 점 하나만 찍는 경우도 보이도록 제자리 선을 하나 긋는다
    emitSeg(last, last);
  });

  canvas.addEventListener('pointermove', function (ev) {
    var raw = toCanvas(ev);
    showBrush(ev);

    var now = Date.now();
    if (now - lastCursorSent > 45) {
      lastCursorSent = now;
      send({ t: 'cursor', x: raw.x, y: raw.y });   // 커서는 실제 위치 그대로 알린다
    }

    if (!drawing) return;
    var p = clampToCell(raw);
    emitSeg(last, p);
    last = p;
  });

  canvas.addEventListener('pointerleave', function () {
    overCanvas = false;
    brushEl.classList.remove('on');
  });
  canvas.addEventListener('pointerenter', function (ev) {
    overCanvas = true;
    showBrush(ev);
  });

  function stop(ev) {
    if (!drawing) return;
    drawing = false;
    last = null;
    try {
      if (ev && ev.pointerId != null && canvas.hasPointerCapture(ev.pointerId)) {
        canvas.releasePointerCapture(ev.pointerId);
      }
    } catch (e) {}
  }
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  canvas.addEventListener('pointerleave', stop);

  function emitSeg(a, b) {
    var seg = {
      t: 'seg', sid: strokeSeq,
      x0: Math.round(a.x * 10) / 10, y0: Math.round(a.y * 10) / 10,
      x1: Math.round(b.x * 10) / 10, y1: Math.round(b.y * 10) / 10,
      w: width, c: color, e: tool === 'eraser'
    };
    drawSeg(seg);                                  // 내 화면엔 즉시
    ops.push({ by: me.id, sid: seg.sid, x0: seg.x0, y0: seg.y0, x1: seg.x1, y1: seg.y1, w: seg.w, c: seg.c, e: seg.e });
    send(seg);                                     // 남에게도
  }

  // ── 붓 크기 원 ──────────────────────────────────
  var brushEl = document.getElementById('brush');
  var lastBrushPos = null, overCanvas = false, brushHideTimer = null;

  function paintBrush() {
    if (!lastBrushPos) return;
    var r = canvas.getBoundingClientRect();
    var scale = r.width / CW;                      // 논리 크기 → 화면 크기 비율
    var d = Math.max(4, width * scale);
    brushEl.style.width = d + 'px';
    brushEl.style.height = d + 'px';
    brushEl.style.left = lastBrushPos.x * scale + 'px';
    brushEl.style.top = lastBrushPos.y * scale + 'px';
    brushEl.classList.toggle('erase', tool === 'eraser');
    brushEl.classList.add('on');
  }

  // ── 참여자 / 커서 ───────────────────────────────
  var peersEl = document.getElementById('peers');

  var gridOn = false;

  // 서버와 같은 규칙으로 계산해야 배정이 어긋나지 않는다
  function layoutFor(n) {
    var cols = Math.max(1, Math.ceil(Math.sqrt(n)));
    return { cols: cols, rows: Math.max(1, Math.ceil(n / cols)) };
  }

  function cellOfIndex(idx, n) {
    var L = layoutFor(n);
    var cw = CW / L.cols, ch = CH / L.rows;
    var cx = idx % L.cols, cy = Math.floor(idx / L.cols);
    return { x0: cx * cw, y0: cy * ch, x1: (cx + 1) * cw, y1: (cy + 1) * ch };
  }

  function myCell() {
    if (!gridOn || me.id == null) return null;
    for (var i = 0; i < peersArr.length; i++) {
      if (peersArr[i].id === me.id) return cellOfIndex(i, peersArr.length);
    }
    return null;
  }

  /** 내 칸 밖으로 나가는 점을 칸 경계 안쪽으로 끌어당긴다(붓 굵기만큼 여유). */
  function clampToCell(p) {
    var c = myCell();
    if (!c) return p;
    var m = width / 2;
    var x0 = c.x0 + m, x1 = c.x1 - m, y0 = c.y0 + m, y1 = c.y1 - m;
    if (x0 > x1) x0 = x1 = (c.x0 + c.x1) / 2;
    if (y0 > y1) y0 = y1 = (c.y0 + c.y1) / 2;
    return { x: Math.min(x1, Math.max(x0, p.x)), y: Math.min(y1, Math.max(y0, p.y)) };
  }

  function renderGrid() {
    gridEl.classList.toggle('on', gridOn);
    gridEl.innerHTML = '';
    if (!gridOn) return;

    var n = peersArr.length;
    for (var i = 0; i < n; i++) {
      var p = peersArr[i];
      var c = cellOfIndex(i, n);
      var el = document.createElement('div');
      el.className = 'cell' + (p.id === me.id ? ' mine' : '');
      el.style.left = (c.x0 / CW * 100) + '%';
      el.style.top = (c.y0 / CH * 100) + '%';
      el.style.width = ((c.x1 - c.x0) / CW * 100) + '%';
      el.style.height = ((c.y1 - c.y0) / CH * 100) + '%';
      if (p.id === me.id) el.style.borderColor = p.color;

      var tag = document.createElement('b');
      tag.style.background = p.color;
      tag.textContent = p.name + (p.id === me.id ? ' (나)' : '');
      el.appendChild(tag);
      gridEl.appendChild(el);
    }
  }

  gridBtn.addEventListener('click', function () {
    send({ t: 'grid', on: !gridOn });
  });

  function renderPeers(list) {
    peersArr = list.slice().sort(function (a, b) { return a.id - b.id; });
    renderGrid();
    peersEl.innerHTML = '';
    list.forEach(function (p) {
      var el = document.createElement('span');
      el.className = 'peer';
      var i = document.createElement('i');
      i.style.background = p.color;
      el.appendChild(i);
      el.appendChild(document.createTextNode(p.name + (p.id === me.id ? ' (나)' : '')));
      peersEl.appendChild(el);
    });
    // 나간 사람 커서 정리
    var alive = {};
    list.forEach(function (p) { alive[p.id] = p; });
    Object.keys(cursors).forEach(function (id) {
      if (!alive[id]) removeCursor(id);
      else {
        cursors[id].el.querySelector('b').style.background = alive[id].color;
        cursors[id].el.querySelector('span').style.background = alive[id].color;
        cursors[id].el.querySelector('span').textContent = alive[id].name;
      }
    });
  }

  function removeCursor(id) {
    if (!cursors[id]) return;
    clearTimeout(cursors[id].timer);
    cursors[id].el.remove();
    delete cursors[id];
  }

  function moveCursor(id, x, y, peer) {
    var c = cursors[id];
    if (!c) {
      var el = document.createElement('div');
      el.className = 'cursor';
      var dot = document.createElement('b');
      var tag = document.createElement('span');
      dot.style.background = (peer && peer.color) || '#888';
      tag.style.background = (peer && peer.color) || '#888';
      tag.textContent = (peer && peer.name) || '?';
      el.appendChild(dot);
      el.appendChild(tag);
      wrap.appendChild(el);
      c = cursors[id] = { el: el, timer: null };
    }
    // 캔버스가 화면 크기에 따라 늘어나므로 위치는 비율(%)로 지정한다
    c.el.style.left = (x / CW * 100) + '%';
    c.el.style.top = (y / CH * 100) + '%';

    clearTimeout(c.timer);
    c.timer = setTimeout(function () { removeCursor(id); }, 6000);
  }

  function addChat(m) {

    who.appendChild(nameSpan);
    who.appendChild(time);

    body.className = 'body';
    body.textContent = m.text;

    line.appendChild(who);
    line.appendChild(body);
    log.appendChild(line);
    if (atBottom) log.scrollTop = log.scrollHeight;

  // 판 크기에 따라 고를 수 있는 줄 수가 달라진다 (가로+세로+대각선)
  function syncGoalOptions() {

  function renderBingo() {
    var s = bingoState;
    boardEl.innerHTML = '';

    if (!s || !s.on) {
      bStatus.textContent = '빙고가 시작되지 않았습니다 — 판 크기와 목표 줄 수를 고르고 게임 시작을 누르세요';

    var myTurn = s.turn === me.id && !s.over;

    // 상태 문구
    if (s.over) {
      var names = s.winners.map(function (w) { return w.name; }).join(', ');

    // 판

    var called = {};

      ? '부른 숫자 (' + s.called.length + '개) — ' + s.called.join(', ')

  function el(tag, cls, text) {

  }

  function renderLiar() {
    var s = liarState;
    lBody.innerHTML = '';
    lPhase.innerHTML = '';
    lVoteBtn.style.display = 'none';

    if (!s || !s.on) {
      lPhase.textContent = '라이어 게임이 시작되지 않았습니다 — 3명 이상 모이면 시작할 수 있습니다';
      return;
    }

    function phaseLine(head, tail) {
      var h = el('span', 'hl', head);
      lPhase.appendChild(h);
      if (tail) lPhase.appendChild(document.createTextNode(tail));
    }

    // ── 설명 단계
    if (s.phase === 'talk') {
      phaseLine('설명 단계', (s.fool ? ' · 🤪 바보 라이어 모드' : '') +
        ' — 주제: ' + s.category + ' · 채팅으로 한 마디씩 설명하세요');
      lVoteBtn.style.display = '';

      var card = el('div', 'card' + (s.isLiar ? ' isliar' : ''));
      if (s.spectator) {
        card.appendChild(el('div', 'cap', '관전 중'));
        card.appendChild(el('div', 'word', '다음 판부터'));
        card.appendChild(el('div', 'sub', '진행 중에 들어오셔서 이번 판은 참여할 수 없습니다'));
      } else if (s.isLiar) {
        card.appendChild(el('div', 'cap', '주제: ' + s.category));
        card.appendChild(el('div', 'word', '당신이 라이어입니다'));
        card.appendChild(el('div', 'sub', '제시어를 모릅니다. 다른 사람 설명을 듣고 아는 척하세요'));
      } else {
        card.appendChild(el('div', 'cap', '주제: ' + s.category + ' · 제시어'));
        card.appendChild(el('div', 'word', s.word));
        card.appendChild(el('div', 'sub', '너무 정확히 설명하면 라이어가 눈치챕니다'));
      }
      lBody.appendChild(card);

      var order = el('div', 'turns');
      order.appendChild(document.createTextNode('설명 순서 — '));
      s.players.forEach(function (p, i) {
        if (i) order.appendChild(document.createTextNode(' → '));
        order.appendChild(el('b', null, p.name + (p.id === me.id ? '(나)' : '')));
      });
      lBody.appendChild(order);
      return;
    }

    // ── 투표 단계
    if (s.phase === 'vote') {
      var votedCount = s.players.filter(function (p) { return p.voted; }).length;
      phaseLine('투표 중', ' — ' + votedCount + ' / ' + s.players.length + '명 완료');

      var box = el('div', 'voteList');
      s.players.forEach(function (p) {
        var b = document.createElement('button');
        var dot = el('i');
        dot.style.background = p.color;
        b.appendChild(dot);
        b.appendChild(document.createTextNode(p.name + (p.id === me.id ? ' (나)' : '')));
        if (p.voted) b.appendChild(el('span', 'done', '✓'));
        if (s.myVote === p.id) b.classList.add('picked');

        var blocked = s.spectator || s.myVote != null || p.id === me.id;
        b.disabled = blocked;
        if (!blocked) {
          b.addEventListener('click', function () { send({ t: 'liar', act: 'vote', target: p.id }); });
        }
        box.appendChild(b);
      });
      lBody.appendChild(box);
      lBody.appendChild(el('div', 'turns',
        s.spectator ? '관전 중이라 투표할 수 없습니다'
          : s.myVote != null ? '투표했습니다. 나머지를 기다리는 중…'
          : '라이어라고 생각하는 사람을 고르세요 (자기 자신은 못 고릅니다)'));
      return;
    }

    // ── 라이어의 최후 기회
    if (s.phase === 'guess') {
      phaseLine('라이어 지목됨', ' — 라이어가 제시어를 맞히면 뒤집힙니다');
      if (s.isLiar) {
        var wrapBox = el('div', 'guessBox');
        var input = document.createElement('input');
        input.placeholder = '제시어 입력';
        input.maxLength = 50;
        var btn = el('button', 'tool', '제출');
        function submit() {
          var v = input.value.trim();
          if (v) send({ t: 'liar', act: 'guess', text: v });
        }
        btn.addEventListener('click', submit);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
        wrapBox.appendChild(input);
        wrapBox.appendChild(btn);
        lBody.appendChild(el('div', 'turns',
          (s.fool ? '사실 당신이 라이어였습니다! 받으신 제시어는 가짜였습니다. ' : '') +
          '당신이 라이어로 지목됐습니다. 진짜 주제는 ' + s.category + ' 입니다.'));
        lBody.appendChild(wrapBox);
        setTimeout(function () { input.focus(); }, 50);
      } else {
        lBody.appendChild(el('div', 'turns', '라이어가 제시어를 맞히는 중입니다…'));
      }
      return;
    }

    // ── 결과
    if (s.phase === 'done' && s.result) {
      var r = s.result;
      lPhase.textContent = '결과';

      var box2 = el('div', 'resultBox');
      box2.appendChild(el('div', 'big ' + (r.citizensWin ? 'citizen' : 'liarwin'),
        r.citizensWin ? '🔎 시민 승리!' : '🕵 라이어 승리!'));

      var d = el('div', 'detail');
      function line(label, value) {
        d.appendChild(document.createTextNode(label + ' '));
        d.appendChild(el('b', null, value));
        d.appendChild(document.createElement('br'));
      }
      line('라이어는', r.liarName + ' 님' + (r.fool ? ' (바보 라이어 — 본인도 몰랐습니다)' : ''));
      line('진짜 제시어는', r.word + ' (' + r.category + ')');
      if (r.fool) line('라이어가 받은 가짜 제시어', r.decoyWord + ' (' + r.decoyCategory + ')');
      if (r.guess != null) {
        line('라이어의 추측', r.guess + (r.guessCorrect ? ' (정답!)' : ' (오답)'));
      }
      if (r.tie) {
        d.appendChild(document.createTextNode('동점이라 지목에 실패했습니다'));
        d.appendChild(document.createElement('br'));
      }
      if (r.counts && r.counts.length) {
        d.appendChild(document.createTextNode('득표 — ' +
          r.counts.map(function (c) { return c.name + ' ' + c.n + '표'; }).join(', ')));
      }
      box2.appendChild(d);
      lBody.appendChild(box2);
      lBody.appendChild(el('div', 'turns', '게임 시작을 다시 누르면 새 판이 시작됩니다'));
    }
  }

  // ── 이름 ────────────────────────────────────────
  var nameInput = document.getElementById('nameInput');
  var savedName = '';
  try { savedName = localStorage.getItem('paint-name') || ''; } catch (e) {}
  if (savedName) nameInput.value = savedName;

  var nameTimer = null;
  nameInput.addEventListener('input', function () {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(function () {
      var v = nameInput.value.trim();
      if (!v) return;
      try { localStorage.setItem('paint-name', v); } catch (e) {}
      send({ t: 'hello', name: v });
    }, 400);
  });

  // ── 연결 ────────────────────────────────────────
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');

  function setStatus(state, text) {
    dot.className = 'dot' + (state ? ' ' + state : '');
    statusText.textContent = text;
  }

  function send(obj) {
    if (ws && connected) ws.send(JSON.stringify(obj));
  }

  var peerMap = {};

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host);

    ws.onopen = function () {
      connected = true;
      setStatus('on', '연결됨');
    };

    ws.onclose = function () {
      connected = false;
      setStatus('off', '연결 끊김 — 다시 연결 중…');
      Object.keys(cursors).forEach(removeCursor);
      setTimeout(connect, 1500);
    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };

    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }

      switch (m.t) {
        case 'init':
          me.id = m.id;
          me.color = m.color;
          gridOn = !!m.grid;
          gridBtn.classList.toggle('active', gridOn);
          if (!nameInput.value) nameInput.value = m.name;
          ops = m.history.slice();
          redraw();
          log.innerHTML = '';
          m.chat.forEach(addChat);
          log.scrollTop = log.scrollHeight;
          m.peers.forEach(function (p) { peerMap[p.id] = p; });
          renderPeers(m.peers);
          // 저장해 둔 이름이 있으면 바로 알린다
          var v = nameInput.value.trim();
          if (v && v !== m.name) send({ t: 'hello', name: v });
          break;

        case 'seg':
          ops.push(m);
          drawSeg(m);
          break;

        case 'undo':
          ops = ops.filter(function (o) { return !(o.by === m.by && o.sid === m.sid); });
          redraw();
          break;

        case 'grid':
          gridOn = m.on;
          gridBtn.classList.toggle('active', gridOn);
          renderGrid();
          addSys(m.by + ' 님이 칸 나누기를 ' + (gridOn ? '켰습니다' : '껐습니다'));
          break;

        case 'cursor':
          moveCursor(m.id, m.x, m.y, peerMap[m.id]);
          break;

        case 'peers':
          peerMap = {};
          m.peers.forEach(function (p) { peerMap[p.id] = p; });
          renderPeers(m.peers);
          break;

        case 'leave':
          removeCursor(m.id);
          break;

        case 'clear':
          ops = [];
          clearCanvas();
          addSys(m.by + ' 님이 캔버스를 전체 지웠습니다');
          break;

        case 'chat':
          addChat(m.msg);
          break;

        case 'sys':
          addSys(m.text);
          break;

        case 'bingo':
          var wasOn = !!(bingoState && bingoState.on);
          bingoState = m;
          renderBingo();
          // 남이 게임을 시작하면 자동으로 빙고 화면으로 넘어간다
          if (!wasOn && m.on) setMode('bingo');
          break;

        case 'liar':
          var liarWasOn = !!(liarState && liarState.on);
          liarState = m;
          renderLiar();
          if (!liarWasOn && m.on) setMode('liar');
          break;
      }
    };
  }

  fit();
  setStatus('', '연결 중…');
  connect();
})();
</script>
</body>
</html>
